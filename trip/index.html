<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="description" content="Our South Island campervan days, campsites and plans. Works offline, syncs between our phones.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>South Island Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: two tabs (Days, Places). Today card on top, then one row per day grouped by stop.
   Day view and map open full screen; sheets for details. */
:root{
  --paper:#f3f4ee; --card:#fbfbf7; --ink:#1d2621; --muted:#64706a; --line:#dde1d6;
  --fern:#2f6b4f; --fern-soft:#dbe9df; --tussock:#b8761f; --tussock-soft:#f3e3c8;
  --sea:#2b6f86; --sea-soft:#d6e8ee; --rust:#a6432e; --rust-soft:#f2dcd5;
  --land:#e4e8dc; --water:#dfe9ec; --on-fern:#ffffff; --contour:#cfd6c6; --road:#d3d9c9;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121815; --card:#1a221e; --ink:#e7ece6; --muted:#97a49c; --line:#29332e;
  --fern:#7cc49b; --fern-soft:#1d3629; --tussock:#e2a552; --tussock-soft:#3a2c17;
  --sea:#79bdd3; --sea-soft:#183139; --rust:#e58a73; --rust-soft:#3d2119;
  --land:#222c27; --water:#15212a; --on-fern:#0e1d16; --contour:#25302a; --road:#2c3832; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121815; --card:#1a221e; --ink:#e7ece6; --muted:#97a49c; --line:#29332e;
  --fern:#7cc49b; --fern-soft:#1d3629; --tussock:#e2a552; --tussock-soft:#3a2c17;
  --sea:#79bdd3; --sea-soft:#183139; --rust:#e58a73; --rust-soft:#3d2119;
  --land:#222c27; --water:#15212a; --on-fern:#0e1d16; --contour:#25302a; --road:#2c3832; color-scheme:dark }
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:12px 110px}
button{font:inherit;color:inherit}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
header .wrap{padding-block:10px 0}
.top{display:flex;align-items:center;gap:6px}
.ttl{flex:1;min-width:0}
h1{font:800 clamp(1rem,4.4vw,1.2rem)/1.1 var(--display);letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayline{font:500 .74rem var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.dot{width:26px;height:40px;border:0;background:none;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.dot i{width:11px;height:11px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 4px var(--line)}
.dot.on i{background:var(--fern);box-shadow:0 0 0 4px var(--fern-soft)}
.dot.wait i{background:var(--tussock);box-shadow:0 0 0 4px var(--tussock-soft)}
.dot.err i{background:var(--rust);box-shadow:0 0 0 4px var(--rust-soft)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--fern);width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);border-radius:12px;padding:3px;margin:10px 0 0}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
header::after{content:"";display:block;height:10px;border-bottom:1px solid var(--line)}

/* bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:700 .92rem var(--body);cursor:pointer;text-decoration:none;min-height:44px}
.btn.primary{background:var(--fern);border-color:var(--fern);color:var(--on-fern)}
.btn.danger{color:var(--rust);border-color:var(--rust);background:none}
.btn.sm{min-height:34px;padding:6px 11px;font-size:.82rem;border-radius:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap;vertical-align:2px;letter-spacing:.02em}
.c-doc{background:var(--fern-soft);color:var(--fern)} .c-free{background:var(--sea-soft);color:var(--sea)}
.c-paid{background:var(--tussock-soft);color:var(--tussock)} .c-booked{background:var(--rust-soft);color:var(--rust)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-flex;align-items:center;font-size:.82rem;font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card)}
.label{font:800 .7rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);padding:18px 0}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}

/* today */
.today{background:var(--fern);color:var(--on-fern);border-radius:20px;padding:16px;display:grid;gap:10px}
.today .k{font:800 .72rem var(--body);letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.today h2{font:800 1.5rem/1.15 var(--display);margin:0;text-wrap:balance}
.today .s{opacity:.85;font-size:.92rem}
.today .bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--on-fern) 25%,transparent);overflow:hidden}
.today .bar span{display:block;height:100%;background:var(--on-fern)}
.today .btn{background:var(--on-fern);color:var(--fern);border-color:transparent}
.today .btn.ghost{background:transparent;color:var(--on-fern);border-color:color-mix(in srgb,var(--on-fern) 45%,transparent)}

/* days list */
.stop-h{display:flex;align-items:flex-end;gap:8px;margin:22px 0 4px}
.stop-h .t{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.stop-h b{display:block;font:800 1.1rem/1.2 var(--display)}
.stop-h small{font-size:.82rem;color:var(--muted)}
.leg{font:500 .72rem var(--mono);color:var(--muted);margin-top:16px}
.day{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:6px;cursor:pointer}
.day .dt{font:500 .8rem/1.2 var(--mono)}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--contour);opacity:.7;
  -webkit-mask:url(contour.svg) 0 0/520px 520px repeat;mask:url(contour.svg) 0 0/520px 520px repeat}
#daylist{position:relative;padding-left:30px}
.road{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.road .asph{stroke:var(--road);stroke-width:11;fill:none;stroke-linecap:round;stroke-linejoin:round}
.road .mid{stroke:var(--paper);stroke-width:1.6;fill:none;stroke-dasharray:6 9}
.road .pin{fill:var(--fern);stroke:var(--paper);stroke-width:2.5}
#van{position:absolute;left:0;top:0;width:18px;height:28px;pointer-events:none;will-change:transform;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.day .wx{display:block;font-style:normal;font-size:.72rem;margin-top:2px;color:var(--ink)}
#extras{display:grid;gap:10px;margin-top:12px}
#extras:empty{display:none}
.mini-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.bk:first-of-type{border-top:0}
.bk .sub{display:block;font-size:.78rem;color:var(--muted)}
.bk .sub.late{color:var(--rust);font-weight:700}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.todo.done .tx{text-decoration:line-through;color:var(--muted)}
.chk.sm{width:30px;height:30px;font-size:.85rem}
.rainok{font-size:.72rem;font-weight:700;color:var(--sea)}
.recap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.recap div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.recap b{display:block;font:800 1.35rem/1.1 var(--display)}
.recap span{font-size:.75rem;color:var(--muted)}
.bars{display:grid;gap:6px}
.bars .r{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.85rem}
.bars i{display:block;height:8px;border-radius:4px;background:var(--fern)}
.openideas{width:100%;justify-content:space-between}
.card.wxline{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:.88rem}
.wxline .big{font:800 1.25rem var(--display)}
.day .dt b{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.day .what{font-size:.92rem;min-width:0}
.day .what .none{color:var(--muted)}
.day .camp{display:block;font-size:.78rem;color:var(--tussock);font-weight:700}
.day .n{font:500 .78rem var(--mono);color:var(--muted)}
.day.past{opacity:.55}
.pastview .day.past{opacity:1}
.ib.kea img{width:26px;height:26px;border-radius:7px;display:block}
.money{font:700 .8rem var(--mono);color:var(--muted);white-space:nowrap}
.money.over{color:var(--rust)}.money.under{color:var(--fern)}
.spend{display:grid;gap:2px}
.spend .r{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem}
.spend .r:first-child{border-top:0}
.spend .tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;padding-top:8px;border-top:2px solid var(--line)}
.fit{display:inline-block;font:700 .7rem var(--body);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.fit.short{background:var(--rust-soft);color:var(--rust)}
.fit.ok{background:var(--fern-soft);color:var(--fern)}
.fit.chill{background:var(--sea-soft);color:var(--sea)}
.day.flex{border:1.5px dashed color-mix(in srgb,var(--muted) 55%,transparent);background:transparent}
.day .fx{display:block;font-size:.72rem;color:var(--muted)}
.day.flex{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.grip{display:grid;place-items:center;width:34px;height:34px;margin:-6px -6px -6px 0;border-radius:10px;color:var(--muted);font-size:1.1rem;touch-action:none;cursor:grab}
.dragging .day.flex.src{opacity:.35}
.drop-on{outline:2px solid var(--fern);outline-offset:2px;border-radius:14px}
.stop-h.drop-on{background:var(--fern-soft)}
.dghost{position:fixed;left:16px;right:16px;z-index:60;pointer-events:none;background:var(--card);border:1.5px dashed var(--fern);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(-50%)}
.dghost small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.flexbox{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:8px;font-size:.88rem}
.cpick{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px}
.cpick button{font-size:.8rem}
.more{display:block;width:100%;margin-top:18px;background:none;border:1px dashed var(--line);border-radius:14px;padding:12px;color:var(--muted);font-weight:700;cursor:pointer}

/* places */
.tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.tools select{width:auto;max-width:44vw}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.pill{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:700 .82rem var(--body);color:var(--muted);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.reg{font:800 .95rem var(--display);margin:18px 0 0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.item .main{background:none;border:0;padding:11px 0;text-align:left;cursor:pointer;min-width:0}
.item .nm{font-weight:700}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .meta{font-size:.78rem;color:var(--muted)}
.item .meta .pl{color:var(--fern);font-weight:700}
.fav{width:40px;height:40px;border:0;background:none;cursor:pointer;color:var(--line);font-size:1.15rem}
.fav.on{color:var(--rust)}
.sg .nm,.nm.sg{color:var(--tussock)}
.item.sg{box-shadow:inset 3px 0 0 var(--tussock);padding-left:10px}
.srcseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);padding:3px;border-radius:12px;margin:2px 0 8px}
.costrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.pick.sm{margin:0;gap:4px;flex-wrap:nowrap}.pick.sm span{padding:9px 14px;font-size:.85rem}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pick label{display:inline-flex}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.88rem;color:var(--muted);cursor:pointer;background:var(--card)}
.pick input:checked+span{background:var(--fern);border-color:var(--fern);color:var(--on-fern,#fff)}
.pick input:focus-visible+span{outline:2px solid var(--fern);outline-offset:2px}
.srcseg.two{grid-template-columns:1fr 1fr;margin:0 0 12px}
.srcseg button{border:0;background:none;border-radius:9px;padding:7px 4px;font:inherit;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer}
.srcseg button[aria-pressed="true"]{background:var(--card,#fff);color:var(--ink,inherit);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.srcseg button.c{color:var(--tussock)}
.srcseg button.c[aria-pressed="true"]{background:var(--tussock);color:#fff}
.tag{font-weight:800;color:var(--tussock)}
.pill.sgp{border-color:var(--tussock);color:var(--tussock)}
.pill.sgp[aria-pressed="true"]{background:var(--tussock);border-color:var(--tussock);color:#fff}
.sgbox{border:1px solid var(--tussock);background:var(--tussock-soft);border-radius:14px;padding:10px 12px;display:grid;gap:8px;font-size:.88rem}
.sgbox b{color:var(--tussock)}

/* full-screen views */
.view{position:fixed;inset:0;z-index:15;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.vhead{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line)}
.vhead .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.vhead h2{flex:1;min-width:0;font:800 1.05rem/1.2 var(--display);margin:0;text-align:center}
.vhead h2 small{display:block;font:500 .74rem var(--body);color:var(--muted)}
.vbody{display:grid;gap:14px;padding-block:14px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.sleep{display:flex;align-items:center;gap:10px}
.sleep .nm{flex:1;min-width:0;font:700 1.05rem/1.25 var(--display)}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;color:transparent;font-weight:800}
.chk.on{background:var(--fern);border-color:var(--fern);color:var(--on-fern)}
.act .main{background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.act .nm{font-weight:700;display:block}
.act.done .nm{text-decoration:line-through;color:var(--muted)}
.act .sub{font-size:.8rem;color:var(--muted)}
.go{display:flex;gap:4px}
.go a{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--sea);text-decoration:none;font:800 .7rem var(--body)}
.addrow{display:flex;gap:8px}
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.idea:first-child{border-top:0}
.rm{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--muted);background:none;font-size:1.15rem;line-height:1;cursor:pointer;flex:none}
.plus{width:36px;height:36px;border-radius:50%;border:1px solid var(--fern);color:var(--fern);background:none;font-size:1.2rem;line-height:1;cursor:pointer}
.mapwrap{background:var(--water);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.mapwrap svg{display:block;width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats b{display:block;font:800 1.2rem var(--display)}

/* sheet */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--paper);border:0;border-radius:999px;width:56px;height:56px;font-size:1.6rem;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-in{max-width:600px;margin:0 auto;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.sheet-in>*,.sheet details,.sheet label{min-width:0}
.sheet h2{font:800 1.25rem/1.2 var(--display);margin:0}
.sheet label{display:grid;gap:4px;font-weight:700;font-size:.82rem}
.sheet input,.sheet select,.sheet textarea{background:var(--paper)}
.sheet details summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:.88rem;padding:4px 0}
.sheet details[open] summary{margin-bottom:10px}
.sheet details>div{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nights{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--paper);border-radius:14px;padding:8px}
.nights b{display:block;font-size:1.05rem}.nights .muted{font-size:.78rem}.nights .ib{font-size:1.3rem;font-weight:700}
.end{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.end>div{display:flex;gap:8px}

<script>
/* ================= constants & helpers ================= */
const REGIONS=["Marlborough","Nelson/Tasman","West Coast","Otago","Fiordland","Southland","Canterbury"];
const KINDS={place:"Sight",hike:"Hike",multi:"Overnight hike",bike:"MTB & bike",disc:"Disc golf",paid:"Paid activity",quirky:"Quirky",food:"Food & drink"};
const KINDS_PL={place:"Sights",hike:"Hikes",multi:"Overnight hikes",bike:"MTB & bike",disc:"Disc golf",paid:"Paid ($)",quirky:"Quirky",food:"Food"};
const CAMPTYPES={doc:"DOC pass",free:"Free (self-contained)",paid:"Paid",booked:"Booked",unknown:"To sort"};
const SHORT={doc:"DOC",free:"Free",paid:"Paid",booked:"Booked",unknown:"?"};
const KM_COST=0.38, ROAD=1.3;
const COLLS=["stops","spots","camps","nights","todos"];
const COLL={stop:"stops",spot:"spots",camp:"camps"};
const state={tab:"days",stops:[],spots:[],camps:[],nights:[],todos:[],ideasOpen:false,kind:"all",region:null,q:"",showPast:false,dview:"ahead",day:null,ideaQ:"",ideaAll:false,src:"both"};
try{const v=localStorage.getItem("sil-sug");state.src=v==="0"?"ours":v==="claude"?"claude":"both"}catch{}
const visSug=x=>state.src==="both"||(state.src==="ours"?(!x.suggested||!!x.day):!!x.suggested);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Pacific/Auckland"});
const D=d=>new Date(d+"T12:00:00");
const fmt=d=>d?D(d).toLocaleDateString("en-NZ",{day:"numeric",month:"short"}):"";
const wd=d=>D(d).toLocaleDateString("en-NZ",{weekday:"short"});
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((D(b)-D(a))/864e5);
const safeUrl=u=>/^https:\/\//i.test(u||"")?u:"";
const icon=(n,cls="svg")=>`<svg class="${cls}"><use href="#i-${n}"/></svg>`;
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const hasLL=s=>typeof s.lat==="number"&&typeof s.lng==="number"&&!isNaN(s.lat)&&!isNaN(s.lng);
const sortStops=()=>[...state.stops].sort((a,b)=>(a.start||"9").localeCompare(b.start||"9")||(a.name||"").localeCompare(b.name||""));
const isPastStop=(s,t)=>s.end&&s.end>s.start?s.end<=t:(s.start||"")<t;
function currentStop(){const t=today(),st=sortStops();return st.find(s=>s.start<=t&&s.end&&t<s.end)||st.find(s=>s.start===t)||st.find(s=>s.start>t)||null}
function stopFor(d){return sortStops().find(s=>s.start&&s.start<=d&&(s.end&&s.end>s.start?d<s.end:d===s.start))}
function stopDays(s){const out=[];if(!s.start)return out;const e=s.end&&s.end>s.start?s.end:addDays(s.start,1);let d=s.start,g=0;while(d<e&&g++<60){out.push(d);d=addDays(d,1)}return out}
function nightInfo(d){const o=state.nights.find(n=>n.id===d),s=stopFor(d);
  return {date:d,stop:s,override:o,camp:(o&&o.camp!=null?o.camp:s?.camp)||"",type:(o&&o.campType?o.campType:s?.campType)||"unknown",notes:o?.notes||"",flex:!!o?.flex}}
const planFor=d=>state.spots.filter(x=>x.day===d).sort((a,b)=>(a.order??0)-(b.order??0)||(a.name||"").localeCompare(b.name||""));
function tripRange(){const st=sortStops();if(!st.length)return null;const first=st[0].start;const last=st.reduce((m,s)=>{const e=s.end||s.start;return e>m?e:m},first);return {first,last}}
function upcomingNights(){const r=tripRange();if(!r)return[];const out=[];let d=today()>r.first?today():r.first,g=0;while(d<r.last&&g++<400){out.push(d);d=addDays(d,1)}return out}
const campOf=n=>state.camps.find(c=>(c.name||"").toLowerCase()===(n.camp||"").toLowerCase())||{name:n.camp,region:n.stop?.region,type:n.type};

/* links */
const MS_INDEX="https://www.metservice.com/towns-cities";
const windyUrl=s=>`https://www.windy.com/${s.lat.toFixed(3)}/${s.lng.toFixed(3)}?${s.lat.toFixed(3)},${s.lng.toFixed(3)},10`;
const LLRE=/^\s*(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/;
const ptOf=x=>{if(hasLL(x))return x;const m=LLRE.exec(x.loc||"");return m?{lat:+m[1],lng:+m[2]}:null};
/* campsites nearest-first to a stop; ones without coordinates fall back to same region, then name */
function campsNear(st){const ref=st&&hasLL(st)?st:null;
  return state.camps.map(c=>{const p=ref&&ptOf(c);return {...c,_km:p?Math.round(hav(ref,p)*ROAD):null}})
    .sort((a,b)=>(a._km??1e6+(a.region===st?.region?0:1e5))-(b._km??1e6+(b.region===st?.region?0:1e5))||(b.fav?1:0)-(a.fav?1:0)||(a.name||"").localeCompare(b.name||""))}
const campList=st=>`<datalist id="camp-names">${campsNear(st).map(c=>`<option value="${esc(c.name)}">${c._km!=null?(c._km<5?"right here":c._km+" km"):""}</option>`).join("")}</datalist>`;
const campChips=st=>{const n=campsNear(st).filter(c=>c._km!=null&&c._km<=120).slice(0,6);return n.length?`<div class="cpick">${n.map(c=>`<button type="button" class="pill" data-pickcamp="${esc(c.name)}">${esc(c.name)} · ${c._km<5?"here":c._km+" km"}</button>`).join("")}</div>`:""};
function dest(x,kind){
  if(hasLL(x))return {ll:x.lat+","+x.lng};
  const m=LLRE.exec(x.loc||"");if(m)return {ll:m[1]+","+m[2]};
  const base=x.loc||((x.name||"")+(kind==="camp"&&!/camp/i.test(x.name||"")?" campsite":"")+(x.region?", "+x.region:""));
  return {q:base+", New Zealand"}}
function gUrl(x,kind){const t=dest(x,kind);return "https://www.google.com/maps/dir/?api=1&destination="+(t.ll||encodeURIComponent(t.q))}
function wazeUrl(x,kind){const t=dest(x,kind);return t.ll?`https://waze.com/ul?ll=${t.ll}&navigate=yes`:`https://waze.com/ul?q=${encodeURIComponent(t.q)}&navigate=yes`}
function infoUrl(x,kind){return safeUrl(x.url)||"https://www.google.com/search?q="+encodeURIComponent((x.name||"")+" "+(x.region||"")+" New Zealand"+(kind==="hike"||(kind==="camp"&&x.type==="doc")?" DOC":""))}
const A=(href,label)=>`<a href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`;
const navLinks=(x,kind)=>`<div class="links">${A(gUrl(x,kind),"Maps")}${A(wazeUrl(x,kind),"Waze")}${A(infoUrl(x,kind),"Info")}</div>`;
const goBtns=(x,kind)=>`<div class="go"><a href="${esc(gUrl(x,kind))}" target="_blank" rel="noopener" aria-label="Google Maps">Maps</a><a href="${esc(wazeUrl(x,kind))}" target="_blank" rel="noopener" aria-label="Waze">Waze</a></div>`;

/* ================= local store + sync ================= */
const LS="sil-v2",OLD="sil-plan-v1",PREV="sil-plan-prev",LS_CRED="sil-sync-v1",KEA_CRED="vanbudget.sync.v1";
let S=loadStore();
function loadStore(){let s=null;try{s=JSON.parse(localStorage.getItem(LS))}catch{}
  if(!s){s={docs:{},pending:{},lastPull:"",synced:false};
    try{const o=JSON.parse(localStorage.getItem(OLD));if(o&&o.stops)s.docs={stops:o.stops,spots:o.spots||{},camps:o.camps||{},nights:o.nights||{}}}catch{}}
  s.docs??={};COLLS.forEach(c=>s.docs[c]??={});s.pending??={};return s}
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch{toast("Phone storage is full — couldn't save")}}
function refresh(){COLLS.forEach(c=>state[c]=Object.entries(S.docs[c]).map(([id,v])=>({id,...v})));render()}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function strip(v){const o={...v};delete o.id;return o}
function put(c,id,v){S.docs[c][id]=strip(v);S.pending[c+"/"+id]=1;persist();refresh();scheduleSync()}
function patch(c,id,p){const o=S.docs[c][id];if(!o)return;put(c,id,{...o,...p})}
function del(c,id){delete S.docs[c][id];S.pending[c+"/"+id]=1;persist();refresh();scheduleSync()}
function add(c,v){const id=newId();put(c,id,v);return id}
function replaceAll(docs){
  try{localStorage.setItem(PREV,JSON.stringify(S.docs))}catch{}
  COLLS.forEach(c=>{const nw=docs[c]||{},cur=S.docs[c];
    Object.keys(cur).forEach(id=>{if(!(id in nw)){delete cur[id];S.pending[c+"/"+id]=1}});
    Object.entries(nw).forEach(([id,v])=>{if(JSON.stringify(cur[id])!==JSON.stringify(v)){cur[id]=v;S.pending[c+"/"+id]=1}})});
  persist();refresh();scheduleSync(300)}
async function fetchPlan(){const r=await fetch("plan.json",{cache:"no-store"});if(!r.ok)throw new Error("plan");return r.json()}

let cred=loadCred(),syncing=false,syncTimer=null,lastErr=null;
function loadCred(){let c={};try{c=JSON.parse(localStorage.getItem(LS_CRED)||"{}")}catch{}
  if(c.off)return {off:true};
  if(!c.url||!c.key){try{const k=JSON.parse(localStorage.getItem(KEA_CRED)||"{}");if(k.url&&k.key)return {url:k.url,key:k.key,fromKea:true}}catch{}}
  return c}
const syncOn=()=>!!(cred.url&&cred.key);
async function api(path,opt={},c=cred){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),15000);
  try{const r=await fetch(c.url.replace(/\/+$/,"")+"/rest/v1/"+path,{...opt,signal:ac.signal,headers:{apikey:c.key,Authorization:"Bearer "+c.key,"Content-Type":"application/json",...(opt.headers||{})}});
    if(!r.ok){let b="";try{b=await r.text()}catch{}const e=new Error("HTTP "+r.status);e.status=r.status;e.body=b;throw e}
    const ct=r.headers.get("content-type")||"";return r.status===204||!ct.includes("json")?null:r.json()}
  finally{clearTimeout(t)}}
async function pullAll(since){const out=[];let off=0;
  for(;;){const rows=await api(`trip_docs?select=coll,id,data,deleted,updated_at${since?"&updated_at=gte."+encodeURIComponent(since):""}&order=updated_at.asc,coll.asc,id.asc&limit=1000&offset=${off}`);
    out.push(...rows);if(rows.length<1000||off>60000)break;off+=1000}
  return out}
const maxTs=rows=>rows.reduce((m,r)=>r.updated_at>m?r.updated_at:m,"");
function scheduleSync(ms=1200){setChip();if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),ms)}
const missingTable=e=>e&&(e.status===404||/PGRST205|trip_docs/.test(e.body||""));
async function sync(manual){
  if(!syncOn()||syncing)return setChip();
  if(!navigator.onLine){if(manual)toast("No signal — changes stay on this phone until you're back online");return setChip()}
  syncing=true;setChip("Syncing…");
  try{
    if(!S.synced){
      const probe=await api("trip_docs?select=id&limit=1");
      if(probe.length){
        try{localStorage.setItem(PREV,JSON.stringify(S.docs))}catch{}
        const all=await pullAll("");const docs={stops:{},spots:{},camps:{},nights:{},todos:{}};
        all.forEach(r=>{if(!r.deleted&&docs[r.coll])docs[r.coll][r.id]=r.data});
        S.docs=docs;S.pending={};S.lastPull=maxTs(all);S.synced=true;persist();refresh();
        toast("Shared plan loaded");return;
      }
      if(!Object.keys(S.docs.stops).length){try{const p=await fetchPlan();COLLS.forEach(c=>S.docs[c]=p[c]||{})}catch{}}
      COLLS.forEach(c=>Object.keys(S.docs[c]).forEach(id=>S.pending[c+"/"+id]=1));
      S.synced=true;persist();refresh();
    }
    const keys=Object.keys(S.pending);
    for(let i=0;i<keys.length;i+=200){
      const chunk=keys.slice(i,i+200),sent={};
      const body=chunk.map(k=>{const j=k.indexOf("/"),c=k.slice(0,j),id=k.slice(j+1),v=S.docs[c]?.[id];sent[k]=JSON.stringify(v??null);return {coll:c,id,data:v||{},deleted:!v}});
      await api("trip_docs?on_conflict=coll,id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(body)});
      chunk.forEach(k=>{const j=k.indexOf("/");if(JSON.stringify(S.docs[k.slice(0,j)]?.[k.slice(j+1)]??null)===sent[k])delete S.pending[k]});
      persist();
    }
    const rows=await pullAll(S.lastPull);let changed=false;
    rows.forEach(r=>{const k=r.coll+"/"+r.id;if(S.pending[k]||!S.docs[r.coll])return;
      if(r.deleted){if(r.id in S.docs[r.coll]){delete S.docs[r.coll][r.id];changed=true}}
      else if(JSON.stringify(S.docs[r.coll][r.id])!==JSON.stringify(r.data)){S.docs[r.coll][r.id]=r.data;changed=true}});
    const m=maxTs(rows);if(m)S.lastPull=m;persist();if(changed)refresh();
    lastErr=null;if(manual)toast("Synced");
  }catch(e){lastErr=e;console.warn("sync",e);if(manual)toast(missingTable(e)?"The shared table isn't set up yet — see ⋯":"Sync failed — will retry")}
  finally{syncing=false;setChip()}
}

function setChip(busy){const c=$("#sync");
  let cls="",label="Saved on this phone only";
  if(syncOn()){const p=Object.keys(S.pending).length;
    if(busy){cls="wait";label="Syncing…"}
    else if(!navigator.onLine){cls="wait";label=p?`Offline — ${p} change${p>1?"s":""} waiting`:"Offline"}
    else if(lastErr){cls="err";label="Sync problem — tap to fix"}
    else if(p){cls="wait";label=`${p} change${p>1?"s":""} waiting`}
    else{cls="on";label="Synced with your partner's phone"}}
  c.className="dot "+cls;c.setAttribute("aria-label",label);c.title=label}

/* ================= map ================= */
const COAST=[[-40.5,172.65],[-40.68,172.7],[-40.8,173.0],[-41.05,173.05],[-41.27,173.28],[-41.0,173.6],[-40.82,173.85],[-40.99,174.31],[-41.27,174.3],[-41.73,174.28],[-42.1,173.95],[-42.42,173.7],[-42.85,173.3],[-43.15,172.8],[-43.53,172.75],[-43.6,173.0],[-43.75,173.12],[-43.88,172.85],[-43.85,172.4],[-44.1,171.8],[-44.4,171.27],[-44.75,171.15],[-45.1,170.97],[-45.5,170.75],[-45.88,170.6],[-46.2,170.15],[-46.45,169.81],[-46.6,169.4],[-46.67,169.0],[-46.6,168.33],[-46.36,168.0],[-46.25,167.4],[-46.16,166.6],[-45.7,166.65],[-45.25,166.85],[-44.95,167.3],[-44.6,167.8],[-44.25,168.2],[-43.98,168.6],[-43.88,169.0],[-43.6,169.6],[-43.4,169.82],[-43.22,170.16],[-42.95,170.65],[-42.72,170.96],[-42.45,171.2],[-42.1,171.33],[-41.75,171.6],[-41.5,171.9],[-41.25,172.1],[-41.1,172.1],[-40.78,172.22],[-40.65,172.43]];
const LAT0=-40.35,LAT1=-46.85,LNG0=166.3,LNG1=174.6,W=400,H=470,kx=Math.cos(43.6*Math.PI/180);
const scale=Math.min((W-20)/((LNG1-LNG0)*kx),(H-20)/(LAT0-LAT1));
const P=(lat,lng)=>[10+(lng-LNG0)*kx*scale,10+(LAT0-lat)*scale];
/* road distance between consecutive stops: real driving km from OSRM once fetched, a rough estimate until then */
const RK="sil-roads";let roads={};try{roads=JSON.parse(localStorage.getItem(RK))||{}}catch{}
const legKey=(a,b)=>`${(+a.lat).toFixed(3)},${(+a.lng).toFixed(3)};${(+b.lat).toFixed(3)},${(+b.lng).toFixed(3)}`;
function legs(){const st=sortStops();return st.map((s,i)=>!i||!hasLL(s)||!hasLL(st[i-1])?0:roads[legKey(st[i-1],s)]??Math.round(hav(st[i-1],s)*ROAD))}
function legReal(i){const st=sortStops();return i>0&&hasLL(st[i])&&hasLL(st[i-1])&&legKey(st[i-1],st[i]) in roads}
let roadBusy=false;
async function pullRoads(){if(roadBusy||!navigator.onLine)return;roadBusy=true;let changed=false;
  try{const st=sortStops().filter(hasLL);
    for(let i=1;i<st.length;i++){const a=st[i-1],b=st[i],k=legKey(a,b);if(k in roads)continue;
      try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`);
        if(!r.ok)break;const j=await r.json();if(j.routes&&j.routes[0]){roads[k]=Math.round(j.routes[0].distance/1000);changed=true}}catch{break}
      await new Promise(r=>setTimeout(r,250))}}
  finally{roadBusy=false}
  if(changed){try{localStorage.setItem(RK,JSON.stringify(roads))}catch{}render()}}
function mapSvg(){
  const t=today(),stops=sortStops().filter(hasLL),cur=currentStop();
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of your route"><rect width="${W}" height="${H}" fill="var(--water)"/><polygon points="${COAST.map(c=>P(...c).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="var(--land)" stroke="var(--line)" stroke-width="1.2" stroke-linejoin="round"/>`;
  if(stops.length>1){const past=[],fut=[];stops.forEach(st=>(isPastStop(st,t)?past:fut).push(P(st.lat,st.lng)));
    if(past.length&&fut.length)fut.unshift(past[past.length-1]);

/* ---- trip so far, at the top of Past ---- */
function recapHTML(){const t=today(),st=sortStops(),L=legs();let km=0;st.forEach((s,i)=>{if(s.start&&s.start<=t)km+=L[i]||0});
  const r=tripRange();if(!r)return "";const nights=[];for(let d=r.first;d<t;d=addDays(d,1))nights.push(d);
  const stayCats=["camp","stay"],paidN=nights.filter(d=>spentOn(d).some(e=>stayCats.includes(e.c))),paidSum=sumA(nights.flatMap(d=>spentOn(d).filter(e=>stayCats.includes(e.c))));
  const free=nights.length-paidN.length,allReal=st.every((s,i)=>!(s.start&&s.start<=t)||!L[i]||legReal(i));
  const reg={};let tot=0;nights.concat([t]).forEach(d=>{const s=stopFor(d),a=sumA(spentOn(d));if(a){tot+=a;const k=s?.region||"Other";reg[k]=(reg[k]||0)+a}});
  const regs=Object.entries(reg).sort((a,b)=>b[1]-a[1]),mx=regs[0]?.[1]||1;
  const doneN=state.spots.filter(x=>x.done).length,favs=state.spots.filter(x=>x.done&&x.fav).map(x=>x.name);
  return `<div class="card"><span class="label">Trip so far</span>
    <div class="recap"><div><b>${nights.length}</b><span>nights</span></div><div><b>${allReal?"":"~"}${km.toLocaleString("en-NZ")}</b><span>km stop to stop</span></div><div><b>${doneN}</b><span>things done</span></div>
      <div><b>${free}</b><span>free nights</span></div><div><b>${paidN.length}</b><span>paid nights${paidSum?` · ${nzd(paidSum)}`:""}</span></div><div><b>${tot?nzd(tot/Math.max(1,nights.length+1)):"–"}</b><span>a day</span></div></div>
    <div class="muted" style="font-size:.75rem">km: road distance between your stops, without side trips or day drives. Paid nights: nights with a Campsites or Stays expense in Kea.</div>
    ${regs.length?`<span class="label" style="margin-top:4px">Spent by region · ${nzd(tot)}</span><div class="bars">${regs.map(([k,v])=>`<div class="r"><span class="clamp1">${esc(k)}</span><i style="width:${Math.max(4,v/mx*100)}%"></i><span class="mono">${nzd(v)}</span></div>`).join("")}</div>`:""}
    ${favs.length?`<span class="label" style="margin-top:4px">Favourites</span><div style="font-size:.9rem">♥ ${favs.slice(0,8).map(esc).join(" · ")}</div>`:""}</div>`}
function renderDays(){
  const t=today(),st=sortStops(),L=legs(),el=$("#daylist");
  if(!st.length){el.innerHTML=`<p class="empty">No stops yet. Tap + to add your first one.</p>`;return}
  let html="",first=true;const past=[];
  st.forEach((s,i)=>{const days=stopDays(s);
    const fut=days.filter(d=>d>t),pd=days.filter(d=>d<t);
    if(pd.length)past.push([s,pd,i]);
    if(fut.length){html+=stopBlock(s,fut,t,L,i,!first&&fut[0]===s.start);first=false}});
  const nPast=past.reduce((n,p)=>n+p[1].length,0),isPast=state.dview==="past";
  $("#dview").innerHTML=`<button type="button" data-dview="ahead" aria-pressed="${!isPast}">Coming up</button><button type="button" data-dview="past" aria-pressed="${isPast}">Past${nPast?` · ${nPast} days`:""}</button>`;
  $("#todaycard").hidden=isPast;el.classList.toggle("pastview",isPast);
  if(isPast){
    if(!past.length){el.innerHTML=`<p class="empty">No days behind you yet.</p>`;return}
    const days=past.flatMap(p=>p[1]),tot=sumA(days.flatMap(spentOn)),pd=keaPerDay();
    el.innerHTML=recapHTML()+(tot?`<div class="muted" style="font-size:.88rem;margin:12px 0 4px">${nPast} days · spent ${nzd(tot)} · ${nzd(tot/nPast)} a day${pd?` (budget ${nzd(pd)})`:""}</div>`:"")+
      past.slice().reverse().map(([s,pd,i])=>stopBlock(s,pd.slice().reverse(),t,L,i,false)).join("");requestAnimationFrame(drawRoad);return}
  if(!html)html=`<p class="empty">No days ahead.</p>`;
  el.innerHTML=html;requestAnimationFrame(drawRoad)}

  if(stopDays(A).length<2)return toast(`${A.name} needs at least one night`),false;
  if(j<i&&B.end<=t)return toast(`${B.name} is already behind you`),false;
  for(let k=lo;k<hi;k++)if(st[k].end!==st[k+1].start)return toast("There's a gap between those stops, change dates by hand"),false;
  const booked=st.slice(lo,hi+1).filter(s=>s.campType==="booked");
  if(booked.length&&!force){confirmMove(d,toId,booked);return false}
  const D=S.docs,mark=(c,id)=>S.pending[c+"/"+id]=1,setS=(id,p)=>{D.stops[id]={...D.stops[id],...p};mark("stops",id)};
  Object.entries(D.spots).forEach(([id,x])=>{if(x.day===d){D.spots[id]={...x,day:null,order:null};mark("spots",id)}});

    for(let x=addDays(d,1);x<B.start;x=addDays(x,1))moveDate(x,addDays(x,-1));
    nd=addDays(B.start,-1);setS(B.id,{start:nd})}

    catch(e){if(missingTable(e)){cred={url,key};try{localStorage.setItem(LS_CRED,JSON.stringify(cred))}catch{}lastErr=e;msg.innerHTML=`<span class="bad">Connected, table missing.</span>`;$("#s-sql").hidden=false}
      else msg.innerHTML=`<span class="bad">${e.status===401||e.status===403?"Key rejected — use the anon key.":"Couldn't connect — check the URL and signal."}</span>`;setChip()}};
  $("#s-test").onclick=()=>{const url=$("#s-url").value.trim(),key=$("#s-key").value.trim();if(!/^https?:\/\/.+/.test(url)||!key){$("#s-msg").innerHTML=`<span class="bad">Fill in both.</span>`;return}test(url,key)};
  $("#s-retest").onclick=()=>{if(syncOn()){$("#form details").open=true;test(cred.url,cred.key)}};
  $("#s-copy").onclick=async e=>{try{await navigator.clipboard.writeText(SQL);e.target.textContent="Copied ✓"}catch{const r=document.createRange();r.selectNodeContents($(".sql"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected — copy it from the menu")}};
  $("#s-off")?.addEventListener("click",()=>{cred={off:true};try{localStorage.setItem(LS_CRED,JSON.stringify(cred))}catch{}S.synced=false;S.lastPull="";persist();setChip();closeSheet();toast("Sharing off")});
  $("#s-dl").onclick=downloadBackup;if($("#s-share"))$("#s-share").onclick=shareBackup;
  $("#s-file").onchange=async e=>{const file=e.target.files[0];if(!file)return;
    try{const d=JSON.parse(await file.text());if(!d||typeof d.stops!=="object")throw 0;replaceAll(d);closeSheet();toast("Restored")}catch{toast("That's not a plan file")}};
  armed($("#s-undo"),"Tap again to undo",()=>{try{replaceAll(JSON.parse(localStorage.getItem(PREV)));localStorage.removeItem(PREV);closeSheet();toast("Undone")}catch{toast("Nothing to undo")}})}

/* ================= events ================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||(b.closest("#form")&&b.type==="submit"))return;
  const ds=b.dataset;
  if(ds.tab){state.tab=ds.tab;document.querySelectorAll(".seg button").forEach(t=>t.setAttribute("aria-selected",t===b));
    $("#days").hidden=ds.tab!=="days";$("#places").hidden=ds.tab!=="places";
    try{localStorage.setItem("sil-tab",ds.tab)}catch{}window.scrollTo(0,0);if(ds.tab==="days")requestAnimationFrame(drawRoad)}
  else if(ds.close==="day")closeDay();
  else if(ds.close==="map")closeMap();
  else if(ds.day)openDay(ds.day);
  else if(ds.unplan){const x=S.docs.spots[ds.unplan],had=keaUnpay(ds.unplan,true);patch("spots",ds.unplan,{day:null,order:null,done:false});toast(`Removed ${x?.name||""} from this day${had?" and from Kea":""}`)}
  else if(ds.plan){const d=state.day;patch("spots",ds.plan,{day:d,order:planFor(d).length});toast("Added")}
  else if(ds.open){const [t,id]=ds.open.split(":"),it=S.docs[COLL[t]][id];if(it)(t==="spot"?openSpot:t==="stop"?openStop:openCamp)({id,...it})}
  else if(ds.edit){const [t,id]=ds.edit.split(":"),it=S.docs[COLL[t]][id];if(it)openStop({id,...it})}
  else if(ds.tog){const [c,f,id]=ds.tog.split(":"),it=S.docs[c][id];if(!it)return;if(c==="spots"&&f==="done")setDone(id,!it.done);else patch(c,id,{[f]:!it[f]})}
  else if(ds.night)openNight(ds.night);
  else if(ds.src){state.src=ds.src;try{localStorage.setItem("sil-sug",{both:"1",ours:"0",claude:"claude"}[ds.src])}catch{}renderPlaces();renderIdeas()}
  else if(ds.kind){state.kind=ds.kind;renderPlaces()}
  else if(ds.dview){state.dview=ds.dview;renderExtras();renderDays();scrollTo(0,0)}
  else if(ds.booked){const [c,id]=ds.booked.split(":");patch(c==="stop"?"stops":"spots",id,{booked:true});toast("Booked ✓")}
  else if(ds.todo){const x=S.docs.todos[ds.todo];if(x)patch("todos",ds.todo,{done:!x.done})}
  else if("cleartodos" in ds){Object.entries(S.docs.todos).filter(([,x])=>x.done).forEach(([id])=>{delete S.docs.todos[id];S.pending["todos/"+id]=1});persist();refresh();scheduleSync();toast("Cleared")}
  else if("openideas" in ds){state.ideasOpen=!state.ideasOpen;renderDay()}
  else if("ideaall" in ds){state.ideaAll=true;renderIdeas()}
});
$("#fab").onclick=()=>state.tab==="days"?openStop():state.kind==="camp"?openCamp():openSpot();
$("#menu").onclick=openSettings;
$("#mapbtn").onclick=openMap;
$("#sync").onclick=()=>{if(syncOn()&&!lastErr){sync(true)}else openSettings()};
$("#scrim").onclick=closeSheet;
$("#q").oninput=e=>{state.q=e.target.value;renderPlaces()};
$("#region").onchange=e=>{state.region=e.target.value;renderPlaces()};
document.addEventListener("change",e=>{if(e.target.id!=="mv-to"||!e.target.value)return;const v=e.target.value;e.target.value="";if(moveNight(state.day,v))closeDay()});
document.addEventListener("input",e=>{if(e.target.id==="q-ideas"){state.ideaQ=e.target.value;state.ideaAll=false;renderIdeas()}});
document.addEventListener("submit",e=>{if(e.target.id!=="addtodo")return;e.preventDefault();const i=$("#f-todo"),v=i.value.trim();if(!v)return;
  i.value="";add("todos",{text:v,done:false,at:new Date().toISOString()});setTimeout(()=>$("#f-todo")?.focus(),0)});
document.addEventListener("submit",e=>{if(e.target.id!=="addact")return;e.preventDefault();
  const name=$("#f-act").value.trim();if(!name)return;const d=state.day;$("#f-act").value="";
  const id=add("spots",{name,kind:"place",region:stopFor(d)?.region||"",notes:"",fav:false,done:false,day:d,order:planFor(d).length});
  openSpot({id,...S.docs.spots[id]},true)});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#sheet").hidden)closeSheet();else if(!$("#mapview").hidden)closeMap();else if(state.day)closeDay()});
window.addEventListener("online",()=>{sync(false);pullKea()});window.addEventListener("offline",()=>setChip());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){loadKea();render();sync(false);pullKea();pullWx()}});
setInterval(()=>{if(document.visibilityState==="visible")sync(false)},45000);

/* ================= start ================= */
try{if(localStorage.getItem("sil-tab")==="places")document.querySelector('[data-tab="places"]').click()}catch{}
refresh();setChip();
(async()=>{
  try{navigator.storage?.persist?.()}catch{}
  if(!Object.keys(S.docs.stops).length){try{const p=await fetchPlan();COLLS.forEach(c=>S.docs[c]=p[c]||{});persist();refresh()}catch{toast("Couldn't load the plan — connect once and reopen")}}
  if(syncOn())sync(false);
  pullKea();pullWx();pullRoads();
})();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
