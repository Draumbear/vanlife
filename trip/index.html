<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="description" content="Our South Island campervan route, campsites and day plans. Works offline, syncs between our phones.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>South Island Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first field notebook. Sticky header (title, sync badge, progress, four tabs);
   full-screen day view; bottom sheets for details and editing. */
:root{
  --paper:#f3f4ee; --card:#fbfbf7; --ink:#1d2621; --muted:#5f6b63; --line:#d9ddd2;
  --fern:#2f6b4f; --fern-soft:#dbe9df; --tussock:#b8761f; --tussock-soft:#f3e3c8;
  --sea:#2b6f86; --sea-soft:#d6e8ee; --rust:#a6432e; --rust-soft:#f2dcd5;
  --land:#e4e8dc; --water:#dfe9ec; --on-fern:#ffffff;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a17; --card:#1b231f; --ink:#e7ece6; --muted:#9aa79f; --line:#2c3732;
  --fern:#7cc49b; --fern-soft:#1f3a2c; --tussock:#e2a552; --tussock-soft:#3a2c17;
  --sea:#79bdd3; --sea-soft:#183139; --rust:#e58a73; --rust-soft:#3d2119;
  --land:#232e29; --water:#16232a; --on-fern:#10201a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#141a17; --card:#1b231f; --ink:#e7ece6; --muted:#9aa79f; --line:#2c3732;
  --fern:#7cc49b; --fern-soft:#1f3a2c; --tussock:#e2a552; --tussock-soft:#3a2c17;
  --sea:#79bdd3; --sea-soft:#183139; --rust:#e58a73; --rust-soft:#3d2119;
  --land:#232e29; --water:#16232a; --on-fern:#10201a; color-scheme:dark }
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:0 110px}
button{font:inherit;color:inherit}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:.85rem}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:800 1.3rem/1.1 var(--display);margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hd-r{display:flex;align-items:center;gap:6px;flex:none}
.sync{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font:700 .75rem var(--body);color:var(--muted);cursor:pointer;white-space:nowrap}
.sync.on{color:var(--fern);border-color:var(--fern)}
.sync.off{color:var(--tussock);border-color:var(--tussock)}
.sync.err{color:var(--rust);border-color:var(--rust)}
.prog{display:flex;align-items:center;gap:10px;margin-top:8px}
.progress{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--fern);width:0}
.tabs{display:flex;margin-top:6px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 2px;font:700 .92rem var(--body);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--tussock)}
section{padding-top:14px}

/* shared bits */
.icon-btn{background:none;border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px;color:var(--muted);cursor:pointer;font-size:1.05rem;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font:700 .92rem var(--body);cursor:pointer;text-decoration:none;min-height:42px}
.btn.primary{background:var(--fern);border-color:var(--fern);color:var(--on-fern)}
.btn.danger{color:var(--rust);border-color:var(--rust);background:none}
.btn.small{min-height:34px;padding:6px 10px;font-size:.82rem}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap;vertical-align:middle}
.c-doc{background:var(--fern-soft);color:var(--fern)} .c-free{background:var(--sea-soft);color:var(--sea)}
.c-paid{background:var(--tussock-soft);color:var(--tussock)} .c-booked{background:var(--rust-soft);color:var(--rust)}
.minilinks{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;font-weight:700}
.minilinks a{text-decoration:none}
.group-h{font:800 .74rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px}
.empty{color:var(--muted);padding:18px 0}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pill{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:700 .82rem var(--body);color:var(--muted);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;scrollbar-width:none}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:8px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;min-width:0}
select{width:auto;max-width:46vw}
textarea{min-height:76px;resize:vertical}

/* tonight card */
.nowcard{background:var(--fern-soft);border-radius:16px;padding:14px 16px 16px;display:grid;gap:8px}
.now-k{font:800 .72rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--fern)}
.nowcard h2{font:800 1.45rem/1.15 var(--display);margin:0;text-wrap:balance}
.campline{font-size:1.02rem}
.now-p{margin:0;font-size:.9rem;color:var(--muted)}
.now-p b{color:var(--ink)}
.preview{background:var(--card);border-radius:10px;padding:8px 12px;font-size:.88rem}
.preview b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* map */
details.mapbox{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
details.mapbox summary{cursor:pointer;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.mapbox summary::-webkit-details-marker{display:none}
details.mapbox summary::after{content:"▾";color:var(--muted)}
details.mapbox[open] summary::after{content:"▴"}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 12px 10px}
.stat{min-width:0}
.stat b{display:block;font:800 1.15rem var(--display)}
.stat small{color:var(--muted);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.mapcard{background:var(--water);border-top:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden}
.mapcard svg{display:block;width:100%;height:auto;max-height:440px}

/* timeline */
.stop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:10px 0;border-top:1px solid var(--line)}
.stop.past{opacity:.6}
.stop-main{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.dates{font:500 .8rem/1.35 var(--mono);color:var(--muted)}
.dates b{display:block;color:var(--ink);font-weight:500}
.stop-name{display:block;font:700 1.05rem/1.25 var(--display)}
.stop-camp{display:block;font-size:.86rem;margin-top:2px}
.stop-notes{font-size:.85rem;color:var(--muted);margin-top:2px}
.daychips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-left:82px}
.daychip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 8px;font:700 .75rem var(--body);cursor:pointer}
.daychip.today{background:var(--fern);color:var(--on-fern);border-color:var(--fern)}
.daychip span{font-family:var(--mono);color:var(--tussock);margin-left:4px}
.daychip.today span{color:var(--on-fern)}
.leg{font:500 .72rem var(--mono);color:var(--muted);padding:2px 0 2px 82px}

/* nights */
.night{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 6px;cursor:pointer}
.night.tonight{background:var(--fern-soft);border-radius:10px;border-top-color:transparent}
.night.past{opacity:.55}
.nd{font:500 .82rem var(--mono)}.nd b{font-weight:500;color:var(--muted);margin-right:4px}
.nc{display:grid;min-width:0}
.ncamp{font-weight:700;overflow-wrap:anywhere}.ncamp i{color:var(--rust);font-weight:400;font-style:normal}
.nstop{color:var(--muted);font-size:.8rem}

/* lists */
.region-h{font:800 1rem var(--display);margin:18px 0 2px;display:flex;justify-content:space-between;align-items:baseline}
.region-h span{font:500 .72rem var(--mono);color:var(--muted)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rowmain{background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;min-width:0}
.row .name{font-weight:700;display:block}
.row.done .name{text-decoration:line-through;color:var(--muted)}
.row .note{color:var(--muted);font-size:.83rem}
.kind{font:500 .68rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kind .plan{color:var(--fern)}
.tg{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1rem;color:var(--muted)}
.tg.on.fav{color:var(--rust);border-color:var(--rust);background:var(--rust-soft)}
.tg.on.chk{color:var(--fern);border-color:var(--fern);background:var(--fern-soft)}

/* day view */
.dayview{position:fixed;inset:0;z-index:15;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.dayhead{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line)}
.dayhead .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.dayhead h2{flex:1;min-width:0;font:800 1.08rem/1.2 var(--display);margin:0;text-align:center}
.dayhead h2 small{display:block;font:500 .75rem var(--body);color:var(--muted)}
.daybody{display:grid;gap:12px;padding-block:12px 48px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;display:grid;gap:8px}
.panel h3{font:800 .72rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.panel .big{font:700 1.15rem/1.25 var(--display);margin:0}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0;padding-top:2px}
.act.done .name{text-decoration:line-through;color:var(--muted)}
.act .name{font-weight:700;display:block}
.act .note{font-size:.83rem;color:var(--muted)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:36px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.mv button:disabled{opacity:.3;cursor:default}
.addrow{display:flex;gap:8px}.addrow input{flex:1}
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.idea .name{font-weight:700}

/* sheet */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--tussock);color:#fff;border:0;border-radius:999px;padding:13px 18px;font:700 .95rem var(--body);box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;max-height:90vh;overflow:auto;padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:620px;margin:0 auto;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.sheet-in>*,.sheet details,.sheet label{min-width:0}
pre.sql{max-width:100%}
.sheet h2{font:800 1.25rem/1.2 var(--display);margin:0}
.sheet label{display:grid;gap:4px;font-weight:700;font-size:.84rem}
.sheet input,.sheet select,.sheet textarea{background:var(--paper)}
.sheet select{width:100%;max-width:none}
.sheet hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:4px}
.hint{color:var(--muted);font-size:.8rem;font-weight:400}
label.check{display:flex;gap:8px;align-items:center;font-weight:400}label.check input{width:auto}
pre.sql{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;font:500 .72rem/1.4 var(--mono);overflow-x:auto;white-space:pre;margin:0;max-height:200px}
.okmsg{color:var(--fern);font-weight:700;font-size:.88rem}.errmsg{color:var(--rust);font-weight:700;font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;font-size:.88rem;max-width:calc(100vw - 32px);text-align:center}
@media (max-width:380px){.two{grid-template-columns:1fr}.daychips,.leg{padding-left:0}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="top">
    <h1>South Island Loop</h1>
    <div class="hd-r"><button class="sync" id="sync" type="button" title="Sync status">Local</button><button class="icon-btn" id="menu" type="button" aria-label="Backup and settings">⋯</button></div>
  </div>
  <div class="prog"><div class="progress" aria-hidden="true"><span id="bar"></span></div><span class="sub mono" id="dayline"></span></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="route">Route</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="nights">Nights</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="spots">Places</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="camps">Camps</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="route">
    <div class="nowcard" id="nowcard" hidden></div>
    <details class="mapbox" id="mapbox"><summary>Map &amp; distances <span class="sub mono" id="mapsum"></span></summary>
      <div class="stats">
        <div class="stat"><small>Stops</small><b class="mono" id="s-stops">–</b></div>
        <div class="stat"><small>Total km</small><b class="mono" id="s-km">–</b></div>
        <div class="stat"><small>Fuel+RUC left</small><b class="mono" id="s-cost">–</b></div>
      </div>
      <div class="mapcard"><svg id="map" viewBox="0 0 400 470" role="img" aria-label="Map of the South Island with your stops"></svg></div>
    </details>
    <div id="timeline"><p class="empty">Loading your route…</p></div>
  </section>

  <section id="nights" hidden>
    <p class="sub" style="margin:0 0 6px">Where you sleep each night. Tap a night to open that day.</p>
    <div id="nightlist"></div>
  </section>

  <section id="spots" hidden>
    <div class="toolbar"><input id="q-spots" type="search" placeholder="Search places &amp; hikes" aria-label="Search places"><select id="r-spots" aria-label="Region"></select></div>
    <div class="filters" id="f-kind"></div>
    <div id="spotlist"></div>
  </section>

  <section id="camps" hidden>
    <div class="toolbar"><input id="q-camps" type="search" placeholder="Search campsites" aria-label="Search campsites"><select id="r-camps" aria-label="Region"></select></div>
    <div class="filters" id="f-type"></div>
    <div id="camplist"></div>
  </section>
</main>

<button class="fab" id="fab" type="button">+ Add stop</button>
<div class="dayview" id="dayview" role="dialog" aria-modal="true" aria-label="Day plan" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden><form class="sheet-in" id="form" novalidate></form></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ================= constants & helpers ================= */
const REGIONS=["Marlborough","Nelson/Tasman","West Coast","Otago","Fiordland","Southland","Canterbury"];
const KINDS={place:"Place",hike:"Hike",bike:"Bike / disc golf"};
const CAMPTYPES={doc:"DOC pass",free:"Free (self-contained)",paid:"Paid",booked:"Booked",unknown:"To sort"};
const SHORT={doc:"DOC",free:"Free",paid:"Paid",booked:"Booked",unknown:"To sort"};
const KM_COST=0.38, ROAD=1.3;
const COLLS=["stops","spots","camps","nights"];
const COLL={stop:"stops",spot:"spots",camp:"camps"};
const state={tab:"route",stops:[],spots:[],camps:[],nights:[],kind:"all",regS:null,regC:null,ctype:"all",qS:"",qC:"",showPast:false,showDone:false,day:null,ideaQ:"",ideaAll:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Pacific/Auckland"});
const D=d=>new Date(d+"T12:00:00");
const fmt=d=>d?D(d).toLocaleDateString("en-NZ",{day:"numeric",month:"short"}):"";
const wd=d=>D(d).toLocaleDateString("en-NZ",{weekday:"short"});
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((D(b)-D(a))/864e5);
const safeUrl=u=>/^https:\/\//i.test(u||"")?u:"";
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const hasLL=s=>typeof s.lat==="number"&&typeof s.lng==="number"&&!isNaN(s.lat)&&!isNaN(s.lng);
const sortStops=()=>[...state.stops].sort((a,b)=>(a.start||"9").localeCompare(b.start||"9")||(a.name||"").localeCompare(b.name||""));
const isPastStop=(s,t)=>s.end&&s.end>s.start?s.end<=t:(s.start||"")<t;
function currentStop(){const t=today(),st=sortStops();return st.find(s=>s.start<=t&&s.end&&t<s.end)||st.find(s=>s.start===t)||st.find(s=>s.start>t)||null}
function stopFor(d){return sortStops().find(s=>s.start&&s.start<=d&&(s.end&&s.end>s.start?d<s.end:d===s.start))}
function stopDays(s){const out=[];if(!s.start)return out;const e=s.end&&s.end>s.start?s.end:addDays(s.start,1);let d=s.start,g=0;while(d<e&&g++<60){out.push(d);d=addDays(d,1)}return out}
function nightInfo(d){const o=state.nights.find(n=>n.id===d),s=stopFor(d);
  return {date:d,stop:s,override:o,camp:(o&&o.camp!=null?o.camp:s?.camp)||"",type:(o&&o.campType?o.campType:s?.campType)||"unknown",notes:o?.notes||""}}
const planFor=d=>state.spots.filter(x=>x.day===d).sort((a,b)=>(a.order??0)-(b.order??0)||(a.name||"").localeCompare(b.name||""));
function tripRange(){const st=sortStops();if(!st.length)return null;const first=st[0].start;const last=st.reduce((m,s)=>{const e=s.end||s.start;return e>m?e:m},first);return {first,last}}
function upcomingNights(){const r=tripRange();if(!r)return[];const out=[];let d=today()>r.first?today():r.first,g=0;while(d<r.last&&g++<400){out.push(d);d=addDays(d,1)}return out}
function curRegion(){return currentStop()?.region||""}

/* links */
const MS_INDEX="https://www.metservice.com/towns-cities";
const windyUrl=s=>`https://www.windy.com/${s.lat.toFixed(3)}/${s.lng.toFixed(3)}?${s.lat.toFixed(3)},${s.lng.toFixed(3)},10`;
const LLRE=/^\s*(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/;
function dest(x,kind){
  if(hasLL(x))return {ll:x.lat+","+x.lng};
  const m=LLRE.exec(x.loc||"");if(m)return {ll:m[1]+","+m[2]};
  const base=x.loc||((x.name||"")+(kind==="camp"&&!/camp/i.test(x.name||"")?" campsite":"")+(x.region?", "+x.region:""));
  return {q:base+", New Zealand"}}
function gUrl(x,kind){const t=dest(x,kind);return "https://www.google.com/maps/dir/?api=1&destination="+(t.ll||encodeURIComponent(t.q))}
function wazeUrl(x,kind){const t=dest(x,kind);return t.ll?`https://waze.com/ul?ll=${t.ll}&navigate=yes`:`https://waze.com/ul?q=${encodeURIComponent(t.q)}&navigate=yes`}
function infoUrl(x,kind){return safeUrl(x.url)||"https://www.google.com/search?q="+encodeURIComponent((x.name||"")+" "+(x.region||"")+" New Zealand"+(kind==="hike"||(kind==="camp"&&x.type==="doc")?" DOC":""))}
function navRow(x,kind){return `<div class="minilinks"><a href="${esc(gUrl(x,kind))}" target="_blank" rel="noopener">Google Maps</a><a href="${esc(wazeUrl(x,kind))}" target="_blank" rel="noopener">Waze</a><a href="${esc(infoUrl(x,kind))}" target="_blank" rel="noopener">${x.url?"Info":"Look up"}</a></div>`}
function weatherRow(s){if(!s)return"";const ms=safeUrl(s.weather);
  return `<div class="minilinks"><a href="${esc(ms||MS_INDEX)}" target="_blank" rel="noopener">MetService${ms?"":" (towns)"}</a>${hasLL(s)?`<a href="${windyUrl(s)}" target="_blank" rel="noopener">Windy</a>`:""}</div>`}

/* ================= local store + sync ================= */
const LS="sil-v2",OLD="sil-plan-v1",PREV="sil-plan-prev",LS_CRED="sil-sync-v1",KEA_CRED="vanbudget.sync.v1";
let S=loadStore();
function loadStore(){let s=null;try{s=JSON.parse(localStorage.getItem(LS))}catch{}
  if(!s){s={docs:{},pending:{},lastPull:"",synced:false};
    try{const o=JSON.parse(localStorage.getItem(OLD));if(o&&o.stops)s.docs={stops:o.stops,spots:o.spots||{},camps:o.camps||{},nights:o.nights||{}}}catch{}}
  s.docs??={};COLLS.forEach(c=>s.docs[c]??={});s.pending??={};return s}
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch{toast("Phone storage is full — couldn't save")}}
function refresh(){COLLS.forEach(c=>state[c]=Object.entries(S.docs[c]).map(([id,v])=>({id,...v})));render()}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function strip(v){const o={...v};delete o.id;return o}
function put(c,id,v){S.docs[c][id]=strip(v);S.pending[c+"/"+id]=1;persist();refresh();scheduleSync()}
function patch(c,id,p){const o=S.docs[c][id];if(!o)return;put(c,id,{...o,...p})}
function del(c,id){delete S.docs[c][id];S.pending[c+"/"+id]=1;persist();refresh();scheduleSync()}
function add(c,v){const id=newId();put(c,id,v);return id}
function replaceAll(docs){
  try{localStorage.setItem(PREV,JSON.stringify(S.docs))}catch{}
  COLLS.forEach(c=>{const nw=docs[c]||{},cur=S.docs[c];
    Object.keys(cur).forEach(id=>{if(!(id in nw)){delete cur[id];S.pending[c+"/"+id]=1}});
    Object.entries(nw).forEach(([id,v])=>{if(JSON.stringify(cur[id])!==JSON.stringify(v)){cur[id]=v;S.pending[c+"/"+id]=1}})});
  persist();refresh();scheduleSync(300)}
async function fetchPlan(){const r=await fetch("plan.json",{cache:"no-store"});if(!r.ok)throw new Error("plan");return r.json()}

let cred=loadCred(),syncing=false,syncTimer=null,lastErr=null;
function loadCred(){let c={};try{c=JSON.parse(localStorage.getItem(LS_CRED)||"{}")}catch{}
  if(c.off)return {off:true};
  if(!c.url||!c.key){try{const k=JSON.parse(localStorage.getItem(KEA_CRED)||"{}");if(k.url&&k.key)return {url:k.url,key:k.key,fromKea:true}}catch{}}
  return c}
const syncOn=()=>!!(cred.url&&cred.key);
async function api(path,opt={},c=cred){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),15000);
  try{const r=await fetch(c.url.replace(/\/+$/,"")+"/rest/v1/"+path,{...opt,signal:ac.signal,headers:{apikey:c.key,Authorization:"Bearer "+c.key,"Content-Type":"application/json",...(opt.headers||{})}});
    if(!r.ok){let b="";try{b=await r.text()}catch{}const e=new Error("HTTP "+r.status);e.status=r.status;e.body=b;throw e}
    const ct=r.headers.get("content-type")||"";return r.status===204||!ct.includes("json")?null:r.json()}
  finally{clearTimeout(t)}}
async function pullAll(since){const out=[];let off=0;
  for(;;){const rows=await api(`trip_docs?select=coll,id,data,deleted,updated_at${since?"&updated_at=gte."+encodeURIComponent(since):""}&order=updated_at.asc,coll.asc,id.asc&limit=1000&offset=${off}`);
    out.push(...rows);if(rows.length<1000||off>60000)break;off+=1000}
  return out}
const maxTs=rows=>rows.reduce((m,r)=>r.updated_at>m?r.updated_at:m,"");
function scheduleSync(ms=1200){setChip();if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),ms)}
const missingTable=e=>e&&(e.status===404||/PGRST205|trip_docs/.test(e.body||""));
async function sync(manual){
  if(!syncOn()||syncing)return setChip();
  if(!navigator.onLine){if(manual)toast("No signal — changes stay on this phone until you're back online");return setChip()}
  syncing=true;setChip("Syncing…");
  try{
    if(!S.synced){
      const probe=await api("trip_docs?select=id&limit=1");
      if(probe.length){
        try{localStorage.setItem(PREV,JSON.stringify(S.docs))}catch{}
        const all=await pullAll("");const docs={stops:{},spots:{},camps:{},nights:{}};
        all.forEach(r=>{if(!r.deleted&&docs[r.coll])docs[r.coll][r.id]=r.data});
        S.docs=docs;S.pending={};S.lastPull=maxTs(all);S.synced=true;persist();refresh();
        toast("Shared plan loaded");return;
      }
      if(!Object.keys(S.docs.stops).length){try{const p=await fetchPlan();COLLS.forEach(c=>S.docs[c]=p[c]||{})}catch{}}
      COLLS.forEach(c=>Object.keys(S.docs[c]).forEach(id=>S.pending[c+"/"+id]=1));
      S.synced=true;persist();refresh();
    }
    const keys=Object.keys(S.pending);
    for(let i=0;i<keys.length;i+=200){
      const chunk=keys.slice(i,i+200),sent={};
      const body=chunk.map(k=>{const j=k.indexOf("/"),c=k.slice(0,j),id=k.slice(j+1),v=S.docs[c]?.[id];sent[k]=JSON.stringify(v??null);return {coll:c,id,data:v||{},deleted:!v}});
      await api("trip_docs?on_conflict=coll,id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(body)});
      chunk.forEach(k=>{const j=k.indexOf("/");if(JSON.stringify(S.docs[k.slice(0,j)]?.[k.slice(j+1)]??null)===sent[k])delete S.pending[k]});
      persist();
    }
    const rows=await pullAll(S.lastPull);let changed=false;
    rows.forEach(r=>{const k=r.coll+"/"+r.id;if(S.pending[k]||!S.docs[r.coll])return;
      if(r.deleted){if(r.id in S.docs[r.coll]){delete S.docs[r.coll][r.id];changed=true}}
      else if(JSON.stringify(S.docs[r.coll][r.id])!==JSON.stringify(r.data)){S.docs[r.coll][r.id]=r.data;changed=true}});
    const m=maxTs(rows);if(m)S.lastPull=m;persist();if(changed)refresh();
    lastErr=null;if(manual)toast("Synced");
  }catch(e){lastErr=e;console.warn("sync",e);if(manual)toast(missingTable(e)?"The shared table isn't set up yet — see ⋯":"Sync failed — will retry")}
  finally{syncing=false;setChip()}
}
function setChip(busy){const c=$("#sync");
  if(!syncOn()){c.textContent="This phone";c.className="sync";c.title="Saved on this phone only";return}
  const p=Object.keys(S.pending).length;
  if(busy){c.textContent=busy;c.className="sync";return}
  if(!navigator.onLine){c.textContent=p?`Offline · ${p}`:"Offline";c.className="sync off";c.title="Changes sync when you have signal";return}
  if(lastErr){c.textContent="Sync error";c.className="sync err";c.title="Tap to see what's wrong";return}
  if(p){c.textContent=`${p} to sync`;c.className="sync off";return}
  c.textContent="Synced";c.className="sync on";c.title="Shared plan is up to date"}

const LAT0=-40.35,LAT1=-46.85,LNG0=166.3,LNG1=174.6,W=400,H=470,kx=Math.cos(43.6*Math.PI/180);
const scale=Math.min((W-20)/((LNG1-LNG0)*kx),(H-20)/(LAT0-LAT1));
const P=(lat,lng)=>[10+(lng-LNG0)*kx*scale,10+(LAT0-lat)*scale];
function drawMap(){
  const t=today(),stops=sortStops().filter(hasLL),cur=currentStop();
  let s=`<rect width="${W}" height="${H}" fill="var(--water)"/><polygon points="${COAST.map(c=>P(...c).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="var(--land)" stroke="var(--line)" stroke-width="1.2" stroke-linejoin="round"/>`;
  if(stops.length>1){const past=[],fut=[];stops.forEach(st=>(isPastStop(st,t)?past:fut).push(P(st.lat,st.lng)));
    if(past.length&&fut.length)fut.unshift(past[past.length-1]);
    if(past.length>1)s+=`<polyline points="${past.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>`;
    if(fut.length>1)s+=`<polyline points="${fut.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--tussock)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`}
  stops.forEach(st=>{const [x,y]=P(st.lat,st.lng),past=isPastStop(st,t),now=cur&&cur.id===st.id;
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${now?7:3.6}" fill="${now?"var(--fern)":past?"var(--muted)":"var(--card)"}" stroke="${now?"var(--card)":past?"var(--muted)":"var(--tussock)"}" stroke-width="2"><title>${esc(st.name)}</title></circle>`});
  if(cur&&hasLL(cur)){const [x,y]=P(cur.lat,cur.lng),left=x>W*0.6;

  $("#map").innerHTML=s}

/* ================= route ================= */
function renderRoute(){
  const t=today(),st=sortStops(),r=tripRange();
  if(r){const total=Math.max(1,daysBetween(r.first,r.last)),done=Math.min(total,Math.max(0,daysBetween(r.first,t)+1));
    $("#bar").style.width=(done/total*100)+"%";$("#dayline").textContent=t<r.first?`Starts ${fmt(r.first)}`:t>=r.last?"Trip done":`Day ${done} of ${total}`}
  let km=0,kmLeft=0;
  const legs=st.map((s,i)=>{if(!i||!hasLL(s)||!hasLL(st[i-1]))return 0;const d=Math.round(hav(st[i-1],s)*ROAD);km+=d;if((s.start||"")>t)kmLeft+=d;return d});
  $("#s-stops").textContent=st.length;$("#s-km").textContent=km?km.toLocaleString("en-NZ"):"–";
  $("#s-cost").textContent=kmLeft?"$"+Math.round(kmLeft*KM_COST).toLocaleString("en-NZ"):"–";
  $("#mapsum").textContent=kmLeft?`~${kmLeft.toLocaleString("en-NZ")} km to go`:"";
  if($("#mapbox").open)drawMap();
  renderNow(legs);
  if(!st.length){$("#timeline").innerHTML=`<p class="empty">No stops yet. Tap <b>+ Add stop</b> to put your first campsite or town on the route.</p>`;return}
  const cur=currentStop();
  const row=(s,i,past,showLeg)=>{
    const nights=s.end&&s.start?Math.max(0,daysBetween(s.start,s.end)):0,days=stopDays(s);
    const open=days.includes(t)?t:days[0]||s.start;
    const chips=days.length>1||!past?days.map(d=>{const c=state.spots.filter(x=>x.day===d).length;return `<button class="daychip ${d===t?"today":""}" type="button" data-day="${d}">${wd(d)} ${D(d).getDate()}${c?`<span>${c}</span>`:""}</button>`}).join(""):"";
    return (showLeg&&legs[i]?`<div class="leg">↓ ~${legs[i]} km · ~$${Math.round(legs[i]*KM_COST)}</div>`:"")+
    `<div class="stop ${past?"past":""}">
      <button class="stop-main" type="button" data-day="${open}" aria-label="Open ${esc(s.name)}">
        <span class="dates"><b>${fmt(s.start)}</b>${nights?`${nights} night${nights>1?"s":""}`:"day stop"}</span>
        <span style="min-width:0"><span class="stop-name">${esc(s.name)}</span>
          ${s.camp?`<span class="stop-camp">⛺ ${esc(s.camp)} <span class="chip c-${esc(s.campType||"unknown")}">${esc(SHORT[s.campType]||"To sort")}</span></span>`:""}
          ${s.notes&&!past?`<span class="stop-notes clamp">${esc(s.notes)}</span>`:""}</span>
      </button>
      <button class="icon-btn" type="button" data-edit="stop:${esc(s.id)}" aria-label="Edit ${esc(s.name)}">✎</button>
      ${chips?`<div class="daychips">${chips}</div>`:""}
    </div>`};
  const up=[],done=[];
  st.forEach((s,i)=>{if(cur&&cur.id===s.id)return;(isPastStop(s,t)?done:up).push([s,i])});
  let html="";
  if(cur&&stopDays(cur).length>1)html+=`<div class="group-h">This stop</div>`+row(cur,st.indexOf(cur),false,false);
  if(up.length)html+=`<div class="group-h">Coming up</div>`+up.map(([s,i],k)=>row(s,i,false,true)).join("");
  if(done.length){html+=`<div class="group-h">Done</div><button class="pill" type="button" data-showdone>${state.showDone?"Hide":"Show"} ${done.length} done stop${done.length>1?"s":""}</button>`;
    if(state.showDone)html+=done.slice().reverse().map(([s,i])=>row(s,i,true,false)).join("")}
  $("#timeline").innerHTML=html;
}
function renderNow(legs){
  const t=today(),st=sortStops(),cur=currentStop(),el=$("#nowcard");
  if(!cur){el.hidden=true;return}
  const i=st.indexOf(cur),next=st[i+1],here=cur.start<=t,d=here?t:cur.start,n=nightInfo(d);
  const left=cur.end?Math.max(0,daysBetween(t,cur.end)):0;
  const legKm=next&&legs?legs[i+1]:0;
  const plan=planFor(d);
  const campObj=state.camps.find(c=>(c.name||"").toLowerCase()===(n.camp||"").toLowerCase())||{name:n.camp,region:cur.region,type:n.type};
  el.hidden=false;
  el.innerHTML=`<div class="now-k">${here?"Tonight · "+wd(t)+" "+fmt(t):"Next stop · "+wd(d)+" "+fmt(d)}</div>
    <h2>${esc(cur.name)}</h2>
    <div class="campline">⛺ <b>${n.camp?esc(n.camp):"No campsite yet"}</b> <span class="chip c-${esc(n.type)}">${esc(SHORT[n.type])}</span></div>
    ${here&&cur.end?`<p class="now-p">${left>1?`${left} nights left here`:left===1?"Last night here":"Moving on today"}${next?` · next <b>${esc(next.name)}</b>${legKm?` · ~${legKm} km`:""}`:""}</p>`:""}
    <div class="preview"><b>${here?"Today":"That day"}</b>${plan.length?plan.slice(0,3).map(x=>esc(x.name)).join(" · ")+(plan.length>3?` · +${plan.length-3} more`:""):"Nothing planned yet"}</div>
    <div class="btnrow"><button class="btn primary" type="button" data-day="${d}">Open ${here?"today":"day"}</button>${n.camp?`<a class="btn" href="${esc(gUrl(campObj,"camp"))}" target="_blank" rel="noopener">Directions to camp</a>`:""}</div>
    ${weatherRow(cur)}`;
}

/* ================= nights ================= */
function renderNights(){
  const r=tripRange(),el=$("#nightlist");
  if(!r){el.innerHTML=`<p class="empty">No stops yet. Add a stop on the Route tab and its nights appear here.</p>`;return}
  const t=today(),fut=[],past=[];let d=r.first,g=0;
  while(d<r.last&&g++<500){(d<t?past:fut).push(d);d=addDays(d,1)}
  const row=d=>{const n=nightInfo(d),cnt=planFor(d).length;
    return `<button type="button" class="night ${d===t?"tonight":""} ${d<t?"past":""}" data-day="${d}">
      <span class="nd"><b>${wd(d)}</b>${fmt(d)}</span>
      <span class="nc"><span class="ncamp">${n.camp?esc(n.camp):"<i>No campsite yet</i>"}</span><span class="nstop">${d===t?"Tonight · ":""}${n.stop?esc(n.stop.name):"No stop planned"}${cnt?` · ${cnt} planned`:""}</span></span>
      <span class="chip c-${esc(n.type)}">${esc(SHORT[n.type])}</span></button>`};
  let m0="",html="";fut.forEach(d=>{const m=D(d).toLocaleDateString("en-NZ",{month:"long"});if(m!==m0){html+=`<div class="group-h">${m}</div>`;m0=m}html+=row(d)});
  if(!fut.length)html=`<p class="empty">No nights ahead.</p>`;
  if(past.length){html+=`<div class="group-h">Past nights</div><button class="pill" type="button" data-showpast>${state.showPast?"Hide":"Show"} ${past.length} past nights</button>`;if(state.showPast)html+=past.slice().reverse().map(row).join("")}
  el.innerHTML=html;
}

/* ================= places & camps ================= */
function regionSelect(el,cur){el.innerHTML=`<option value="all">All regions</option>`+REGIONS.map(r=>`<option value="${esc(r)}" ${r===cur?"selected":""}>${esc(r)}</option>`).join("");if(cur==="all")el.value="all"}
function pills(el,opts,cur,key){el.innerHTML=opts.map(([v,l,n])=>`<button class="pill" type="button" aria-pressed="${v===cur}" data-f="${key}" data-v="${esc(v)}">${esc(l)}${n!=null?` <span class="mono">${n}</span>`:""}</button>`).join("")}
function grouped(items,render){const by={};items.forEach(it=>(by[it.region||"Other"]??=[]).push(it));
  const order=[...REGIONS,...Object.keys(by).filter(r=>!REGIONS.includes(r))];
  return order.filter(r=>by[r]).map(r=>`<div class="region-h">${esc(r)}<span>${by[r].length}</span></div>`+by[r].sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||(a.done?1:0)-(b.done?1:0)||(a.name||"").localeCompare(b.name||"")).map(render).join("")).join("")}
function renderSpots(){
  if(state.regS===null)state.regS=curRegion()||"all";
  regionSelect($("#r-spots"),state.regS);
  const q=state.qS.toLowerCase(),base=state.spots.filter(s=>q||state.regS==="all"||s.region===state.regS);
  pills($("#f-kind"),[["all","All",base.length],["todo","To do",base.filter(s=>!s.done).length],["fav","♥",base.filter(s=>s.fav).length],["planned","Planned",base.filter(s=>s.day).length],...Object.entries(KINDS).map(([k,l])=>[k,l,base.filter(s=>s.kind===k).length])],state.kind,"kind");
  const k=state.kind,items=base.filter(s=>(k==="all"||(k==="fav"?s.fav:k==="todo"?!s.done:k==="planned"?!!s.day:s.kind===k))&&(!q||(s.name+" "+(s.notes||"")).toLowerCase().includes(q)));

function renderIdeas(){

function planAct(op,id){
  const d=state.day,plan=planFor(d);
  if(op==="add"){patch("spots",id,{day:d,order:plan.length});toast("Added to the day")}
  else{const i=plan.findIndex(x=>x.id===id),j=op==="up"?i-1:i+1;if(i<0||j<0||j>=plan.length)return;
    const arr=plan.slice();[arr[i],arr[j]]=[arr[j],arr[i]];arr.forEach((x,k)=>{if(x.order!==k)S.docs.spots[x.id]={...S.docs.spots[x.id],order:k},S.pending["spots/"+x.id]=1});

}

function setNight(d,camp,type,notes){
  const s=stopFor(d);
  if(s&&s.camp===camp&&(s.campType||"unknown")===type&&!notes){if(S.docs.nights[d])del("nights",d)}
  else put("nights",d,{camp,campType:type,notes:notes||""});
}
$("#form").addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,type=f.dataset.type,id=f.dataset.id;if(type==="settings")return;
  const fd=new FormData(f),v={};for(const [k,x] of fd.entries())v[k]=typeof x==="string"?x.trim():x;
  if(f.querySelector("[name=name]")&&!v.name){toast("Give it a name first");f.querySelector("[name=name]").focus();return}
  if(type==="night"){
    if(v.all){const s=stopFor(id);patch("stops",s.id,{camp:v.camp,campType:v.campType});stopDays(s).forEach(d=>{if(S.docs.nights[d])del("nights",d)});if(v.notes)put("nights",id,{camp:v.camp,campType:v.campType,notes:v.notes})}
    else setNight(id,v.camp,v.campType,v.notes);
    closeSheet();toast("Saved");return}
  if(type==="stop"){
    if(!v.start){toast("Pick an arrival date");return}
    const num=x=>x===""||x==null?null:parseFloat(String(x).replace(",","."));v.lat=num(v.lat);v.lng=num(v.lng);if(v.end&&v.end<v.start)v.end=v.start}
  if(type==="spot"){v.day=v.day||null;v.done=!!v.done;if(v.day&&id&&S.docs.spots[id]?.day!==v.day)v.order=planFor(v.day).length}
  let sleep=null;if(type==="camp"){sleep=v.sleep;delete v.sleep}
  const c=COLL[type],prev=id?S.docs[c][id]:null;
  const doc={...(prev||{}),...v};
  if(type==="spot"&&!id){doc.fav=false;if(!("done" in v))doc.done=false}
  if(id)put(c,id,doc);else add(c,doc);
  if(sleep)setNight(sleep,doc.name,doc.type||"unknown","");
  closeSheet();toast(id?(sleep?`Saved · sleeping here ${fmt(sleep)}`:"Saved"):"Added");
});

const SQL=`create table if not exists trip_docs (
  coll text not null, id text not null,
  data jsonb not null default '{}'::jsonb,
  deleted boolean not null default false,
  updated_at timestamptz not null default now(),
  primary key (coll, id));
create index if not exists trip_docs_updated on trip_docs (updated_at);
create or replace function trip_docs_touch() returns trigger
  language plpgsql set search_path = '' as $$
  begin new.updated_at := now(); return new; end $$;
drop trigger if exists trip_docs_touch on trip_docs;
create trigger trip_docs_touch before insert or update on trip_docs
  for each row execute function trip_docs_touch();
alter table trip_docs enable row level security;
drop policy if exists trip_docs_all on trip_docs;
create policy trip_docs_all on trip_docs for all to anon using (true) with check (true);
grant select, insert, update, delete on trip_docs to anon;`;

      <div id="s-msg" style="margin-top:6px"></div>
      <div id="s-sql" ${lastErr&&missingTable(lastErr)?"":"hidden"} style="margin-top:6px"><span class="hint">Run this once in Supabase → SQL Editor, then tap Save &amp; test again.</span><pre class="sql">${esc(SQL)}</pre><button type="button" class="btn small" id="s-copy" style="margin-top:6px">Copy SQL</button></div>
    </details>
    <hr>
    <h3 class="group-h" style="margin:0">Backup</h3>

    msg.innerHTML=`<span class="sub">Testing…</span>`;
    try{await api("trip_docs?select=id&limit=1",{},{url,key});
      const changed=url!==cred.url||key!==cred.key;cred={url,key};try{localStorage.setItem(LS_CRED,JSON.stringify(cred))}catch{}
      if(changed){S.synced=false;S.lastPull=""}lastErr=null;persist();
      msg.innerHTML=`<span class="okmsg">✓ Connected. Syncing now.</span>`;$("#s-sql").hidden=true;sync(true)}
    catch(e){if(missingTable(e)){cred={url,key};try{localStorage.setItem(LS_CRED,JSON.stringify(cred))}catch{}msg.innerHTML=`<span class="errmsg">Connected, but the table is missing.</span>`;$("#s-sql").hidden=false}
      else msg.innerHTML=`<span class="errmsg">${e.status===401||e.status===403?"The key was rejected — use the anon / publishable key.":"Couldn't reach Supabase — check the URL and your signal."}</span>`}};
  $("#s-off")?.addEventListener("click",()=>{cred={off:true};try{localStorage.setItem(LS_CRED,JSON.stringify(cred))}catch{}S.synced=false;S.lastPull="";persist();setChip();closeSheet();toast("Sync off — plan stays on this phone")});
  $("#s-file").onchange=async e=>{const file=e.target.files[0];if(!file)return;
    try{const d=JSON.parse(await file.text());if(!d||typeof d.stops!=="object")throw 0;replaceAll(d);closeSheet();toast(syncOn()?"Restored and shared":"Plan restored")}catch{toast("That file isn't a South Island Loop plan")}};
  armed($("#s-undo"),"Tap again to undo",()=>{try{replaceAll(JSON.parse(localStorage.getItem(PREV)));localStorage.removeItem(PREV);closeSheet();toast("Previous plan restored")}catch{toast("Nothing to undo")}});
}

/* ================= events ================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.closest("#form")&&b.type==="submit")return;
  const ds=b.dataset;
  if(ds.tab){state.tab=ds.tab;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t===b));
    ["route","nights","spots","camps"].forEach(s=>$("#"+s).hidden=s!==state.tab);
    $("#fab").textContent={route:"+ Add stop",nights:"+ Add stop",spots:"+ Add place",camps:"+ Add campsite"}[state.tab];
    try{localStorage.setItem("sil-tab",state.tab)}catch{}window.scrollTo(0,0)}
  else if("closeday" in ds)closeDay();
  else if(ds.day)openDay(ds.day);
  else if(ds.plan){const [op,id]=ds.plan.split(":");planAct(op,id)}
  else if(ds.open){const [t,id]=ds.open.split(":");const it=S.docs[COLL[t]][id];if(it)(t==="spot"?openSpot:openCamp)({id,...it})}
  else if(ds.edit){const [t,id]=ds.edit.split(":");const it=S.docs[COLL[t]][id];if(it)openStop({id,...it})}
  else if(ds.tog){const [c,f,id]=ds.tog.split(":");const it=S.docs[c][id];if(it)patch(c,id,{[f]:!it[f]})}
  else if(ds.night)openNight(ds.night);
  else if("showpast" in ds){state.showPast=!state.showPast;renderNights()}
  else if("showdone" in ds){state.showDone=!state.showDone;renderRoute()}
  else if("ideaall" in ds){state.ideaAll=true;renderIdeas()}
  else if(ds.f){state[ds.f]=ds.v;render()}
});
$("#fab").onclick=()=>({route:openStop,nights:openStop,spots:openSpot,camps:openCamp})[state.tab]();
$("#menu").onclick=openSettings;
$("#sync").onclick=()=>{if(!syncOn()||lastErr)openSettings();else sync(true)};
$("#scrim").onclick=closeSheet;
$("#mapbox").addEventListener("toggle",()=>{try{localStorage.setItem("sil-map",$("#mapbox").open?"1":"0")}catch{}if($("#mapbox").open)drawMap()});
$("#q-spots").oninput=e=>{state.qS=e.target.value;renderSpots()};
$("#q-camps").oninput=e=>{state.qC=e.target.value;renderCamps()};
$("#r-spots").onchange=e=>{state.regS=e.target.value;renderSpots()};
$("#r-camps").onchange=e=>{state.regC=e.target.value;renderCamps()};
document.addEventListener("input",e=>{if(e.target.id==="q-ideas"){state.ideaQ=e.target.value;state.ideaAll=false;renderIdeas()}});
document.addEventListener("submit",e=>{if(e.target.id!=="addact")return;e.preventDefault();
  const name=$("#f-act").value.trim();if(!name)return;const d=state.day;$("#f-act").value="";
  add("spots",{name,kind:"place",region:stopFor(d)?.region||"",notes:"",fav:false,done:false,day:d,order:planFor(d).length});toast("Added to the day")});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#sheet").hidden)closeSheet();else if(state.day)closeDay()});
window.addEventListener("online",()=>sync(false));window.addEventListener("offline",()=>setChip());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){render();sync(false)}});
setInterval(()=>{if(document.visibilityState==="visible")sync(false)},45000);

/* ================= start ================= */
try{if(localStorage.getItem("sil-map")==="1")$("#mapbox").open=true}catch{}
try{const t=localStorage.getItem("sil-tab");if(t&&t!=="route")document.querySelector(`[data-tab="${t}"]`)?.click()}catch{}
refresh();setChip();
(async()=>{
  try{navigator.storage?.persist?.()}catch{}
  if(!Object.keys(S.docs.stops).length){try{const p=await fetchPlan();COLLS.forEach(c=>S.docs[c]=p[c]||{});persist();refresh()}catch{toast("Couldn't load the plan — connect once and reopen")}}
  if(syncOn())sync(false);
})();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
