<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="description" content="Our South Island campervan days, campsites and plans. Works offline, syncs between our phones.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Aotearoa Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: two tabs (Days, Places). Today card on top, then one row per day grouped by stop.
   Day view and map open full screen; sheets for details. */
:root{
  --paper:#f3f4ee; --card:#fbfbf7; --ink:#1d2621; --muted:#64706a; --line:#dde1d6;
  --fern:#2f6b4f; --fern-soft:#dbe9df; --tussock:#b8761f; --tussock-soft:#f3e3c8;
  --sea:#2b6f86; --sea-soft:#d6e8ee; --rust:#a6432e; --rust-soft:#f2dcd5;
  --land:#e4e8dc; --water:#dfe9ec; --on-fern:#ffffff; --contour:#cfd6c6; --road:#d3d9c9;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121815; --card:#1a221e; --ink:#e7ece6; --muted:#97a49c; --line:#29332e;
  --fern:#7cc49b; --fern-soft:#1d3629; --tussock:#e2a552; --tussock-soft:#3a2c17;
  --sea:#79bdd3; --sea-soft:#183139; --rust:#e58a73; --rust-soft:#3d2119;
  --land:#222c27; --water:#15212a; --on-fern:#0e1d16; --contour:#25302a; --road:#2c3832; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121815; --card:#1a221e; --ink:#e7ece6; --muted:#97a49c; --line:#29332e;
  --fern:#7cc49b; --fern-soft:#1d3629; --tussock:#e2a552; --tussock-soft:#3a2c17;
  --sea:#79bdd3; --sea-soft:#183139; --rust:#e58a73; --rust-soft:#3d2119;
  --land:#222c27; --water:#15212a; --on-fern:#0e1d16; --contour:#25302a; --road:#2c3832; color-scheme:dark }
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:12px 110px}
button{font:inherit;color:inherit}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
header .wrap{padding-block:10px 0}
.top{display:flex;align-items:center;gap:6px}
.ttl{flex:1;min-width:0}
h1{font:800 clamp(1rem,4.4vw,1.2rem)/1.1 var(--display);letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayline{font:500 .74rem var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.dot{width:26px;height:40px;border:0;background:none;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.dot i{width:11px;height:11px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 4px var(--line)}
.dot.on i{background:var(--fern);box-shadow:0 0 0 4px var(--fern-soft)}
.dot.wait i{background:var(--tussock);box-shadow:0 0 0 4px var(--tussock-soft)}
.dot.err i{background:var(--rust);box-shadow:0 0 0 4px var(--rust-soft)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--fern);width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);border-radius:12px;padding:3px;margin:10px 0 0}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
header::after{content:"";display:block;height:10px;border-bottom:1px solid var(--line)}

/* bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:700 .92rem var(--body);cursor:pointer;text-decoration:none;min-height:44px}
.btn.primary{background:var(--fern);border-color:var(--fern);color:var(--on-fern)}
.btn.danger{color:var(--rust);border-color:var(--rust);background:none}
.btn.sm{min-height:34px;padding:6px 11px;font-size:.82rem;border-radius:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap;vertical-align:2px;letter-spacing:.02em}
.c-doc{background:var(--fern-soft);color:var(--fern)} .c-free{background:var(--sea-soft);color:var(--sea)}
.c-paid{background:var(--tussock-soft);color:var(--tussock)} .c-booked{background:var(--rust-soft);color:var(--rust)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-flex;align-items:center;font-size:.82rem;font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card)}
.label{font:800 .7rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);padding:18px 0}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}

/* today */
.today{background:var(--fern);color:var(--on-fern);border-radius:20px;padding:16px;display:grid;gap:10px}
.today .k{font:800 .72rem var(--body);letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.today h2{font:800 1.5rem/1.15 var(--display);margin:0;text-wrap:balance}
.today .s{opacity:.85;font-size:.92rem}
.today .bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--on-fern) 25%,transparent);overflow:hidden}
.today .bar span{display:block;height:100%;background:var(--on-fern)}
.today .btn{background:var(--on-fern);color:var(--fern);border-color:transparent}
.today .thead{background:none;border:0;padding:0;color:inherit;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;cursor:pointer;font:inherit}
.today .thead .s{grid-column:1/-1}
.today .twx{font-weight:800;font-size:.9rem;white-space:nowrap}
.tplan{background:color-mix(in srgb,var(--on-fern) 12%,transparent);border-radius:14px;padding:6px 10px;display:grid}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--on-fern) 18%,transparent)}
.trow.done .tn{text-decoration:line-through;opacity:.7}
.tn{background:none;border:0;padding:0;color:inherit;font:700 1rem var(--body);text-align:left;cursor:pointer;min-width:0}
.tn small{font:600 .78rem var(--mono);opacity:.85;margin-left:4px}
.today .tw{border-color:color-mix(in srgb,var(--on-fern) 40%,transparent);background:transparent;color:var(--on-fern)}
.today .chk.tw{color:transparent;border-width:2px}
.today .chk.tw.on{background:var(--on-fern);color:var(--fern)}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding-top:8px}
.tadd{display:inline-flex;align-items:center;gap:4px;background:var(--on-fern);color:var(--fern);border:0;border-radius:999px;padding:6px 12px 6px 8px;font:800 .85rem var(--body);cursor:pointer}
.tadd .svg{width:16px;height:16px}
.tmore{background:none;border:0;color:inherit;opacity:.85;font:700 .82rem var(--body);padding:8px 0 0;text-align:left;cursor:pointer}
.tnight{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tnight b{font-weight:800}
.tbtns{display:flex;gap:6px}
.today .btn.ghost{background:transparent;color:var(--on-fern);border-color:color-mix(in srgb,var(--on-fern) 45%,transparent)}

/* days list */
.stop-h{display:flex;align-items:flex-end;gap:8px;margin:22px 0 4px;position:relative}
.stop-h .t{position:relative;z-index:1}
.lm{position:absolute;right:4px;bottom:-30px;width:96px;height:72px;color:var(--muted);opacity:.85;z-index:0;pointer-events:none}
.day{position:relative;z-index:1}
.deco{position:absolute;pointer-events:none}
.deco.hat{left:-8px;top:-20px;width:42px;height:36px;transform:rotate(-14deg);filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.deco.cake{right:46px;top:-18px;width:34px;height:34px}
.deco .flame{animation:flick .5s ease-in-out infinite alternate;transform-origin:center bottom;transform-box:fill-box}
@keyframes flick{to{transform:scaleY(.8) translateY(1px)}}
.deco.fw{right:24px;bottom:-34px;width:100px;height:44px;z-index:2}
.deco.fw svg{position:absolute;width:38px;height:38px;animation:burst 1.4s ease-out infinite;opacity:0}
@keyframes burst{0%{transform:scale(.2);opacity:0}25%{opacity:1}70%{transform:scale(1);opacity:.9}100%{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){.deco.fw svg{animation:none;opacity:1}.deco .flame{animation:none}}
.stop-h .t{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.stop-h b{display:block;font:800 1.1rem/1.2 var(--display)}
.stop-h small{font-size:.82rem;color:var(--muted)}
.leg{font:500 .72rem var(--mono);color:var(--muted);margin-top:16px}
.day{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:6px;cursor:pointer}
.day .dt{font:500 .8rem/1.2 var(--mono)}
#splash{position:fixed;inset:0;z-index:200;background:var(--fern);display:grid;place-items:center;align-content:center;gap:14px;animation:spOut .45s ease 1.75s forwards}
@keyframes spOut{to{opacity:0;visibility:hidden}}
.sp-scene{position:relative;width:250px;height:160px;overflow:visible}
.sp-van{position:absolute;left:24px;bottom:7px;width:206px;animation:spBob .28s ease-in-out infinite alternate}
@keyframes spBob{to{transform:translateY(-2.5px)}}
.sp-wheel{transform-box:fill-box;transform-origin:center;animation:spSpin .45s linear infinite}
@keyframes spSpin{to{transform:rotate(-360deg)}}
.sp-road{position:absolute;left:-60px;right:-60px;bottom:12px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--on-fern) 0 26px,transparent 26px 52px);opacity:.55;animation:spRoad .35s linear infinite}
@keyframes spRoad{to{background-position:-52px 0}}
.sp-puffs i{position:absolute;left:12px;bottom:27px;width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--on-fern) 75%,transparent);opacity:0;animation:spPuff .9s ease-out infinite}
.sp-puffs i:nth-child(2){animation-delay:.3s}.sp-puffs i:nth-child(3){animation-delay:.6s}
@keyframes spPuff{0%{opacity:.85;transform:translate(0,0) scale(.35)}100%{opacity:0;transform:translate(-48px,-26px) scale(1.7)}}
.sp-light{animation:spBlink 1s steps(2) infinite}
@keyframes spBlink{50%{opacity:.6}}
.sp-title{color:var(--on-fern);font:800 1.45rem var(--display);opacity:0;transform:translateY(6px);animation:spUp .5s ease .35s forwards}
@keyframes spUp{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash{animation-delay:.6s}.sp-van,.sp-wheel,.sp-road,.sp-puffs i,.sp-light{animation:none}.sp-title{animation-delay:0s}}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--contour);opacity:.7;
  -webkit-mask:url(contour.svg) 0 0/520px 520px repeat;mask:url(contour.svg) 0 0/520px 520px repeat}
#daylist{position:relative;padding-left:30px}
.road{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:1}
.road .asph{stroke:var(--road);stroke-width:11;fill:none;stroke-linecap:round;stroke-linejoin:round}
.road .mid{stroke:var(--paper);stroke-width:1.6;fill:none;stroke-dasharray:6 9}
.road .pin{fill:var(--fern);stroke:var(--paper);stroke-width:2.5}
.fly-panel{position:relative;z-index:0;height:1440px;margin:26px 0 0 -30px;border-radius:18px;overflow:hidden;
  background:radial-gradient(60px 22px at 22% 700px,#fff8 98%,#0000),radial-gradient(80px 26px at 76% 1010px,#fff8 98%,#0000),radial-gradient(70px 20px at 30% 1120px,#fff6 98%,#0000),linear-gradient(#cfe0e8 0,#9fc6dd 520px,#7fb2d4 1000px,#b9d6e6 1400px)}
.fly-panel .fcap.ftop{left:auto;right:14px;top:28px;bottom:auto;text-align:right}
.skylab{position:absolute;display:grid;gap:1px;opacity:.55;transition:opacity .3s,transform .3s;transform:translateY(4px)}
.skylab.r{text-align:right}
#welcome .wave{transform-box:fill-box;transform-origin:0% 100%}
#welcome.on .wave{animation:wave .35s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
#welcome .balloon{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.skylab.on{opacity:1;transform:none}.skylab b{font:800 1rem var(--display);color:#1d2621}.skylab span{font-size:.8rem;color:#33424a}
#people{position:absolute;left:0;top:0;z-index:3;display:flex;gap:3px;transition:opacity .2s;pointer-events:none}
#people i{width:9px;height:9px;border-radius:50%;background:#e8833a;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
#people i+i{background:#2b6f86}
#people.walk i{animation:step .32s ease-in-out infinite alternate}#people.walk i+i{animation-delay:.16s}
@keyframes step{to{transform:translateY(-2px)}}
#plane{position:absolute;left:0;top:0;z-index:3;transform-origin:60px 55px;pointer-events:none;will-change:transform}
#van .sold{position:absolute;right:-12px;top:-10px;width:18px;height:18px;border-radius:50%;background:#2f8f4e;color:#fff;font:800 11px/18px var(--body);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.35);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.6,1)}
#van.sold .sold{transform:scale(1)}
.sea-end{position:relative;z-index:0;height:440px;margin:26px 0 0 -30px;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(170deg,transparent 0 22px,color-mix(in srgb,var(--card) 35%,transparent) 22px 24px),linear-gradient(var(--sea-soft),color-mix(in srgb,var(--sea) 30%,var(--sea-soft)))}
.sea-end .fcap{top:auto;bottom:24px}
.sea-panel{position:relative;z-index:0;height:620px;margin:26px 0 26px -30px;border-radius:18px;overflow:hidden;
  background:repeating-linear-gradient(170deg,transparent 0 22px,color-mix(in srgb,var(--card) 35%,transparent) 22px 24px),linear-gradient(var(--sea-soft),color-mix(in srgb,var(--sea) 30%,var(--sea-soft)))}
.fcap{position:absolute;left:150px;right:12px;top:40px;display:grid;gap:2px}
.sea-panel .fcap{top:auto;bottom:24px}
.fcap b{font:800 1.05rem var(--display)}.fcap span{font-size:.85rem;color:var(--muted)}
.road .bob{animation:bob 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{from{transform:rotate(-1.2deg) translateY(0)}to{transform:rotate(1.2deg) translateY(3px)}}
#van.aboard{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
#van{position:absolute;left:0;top:0;width:18px;height:28px;pointer-events:none;will-change:transform;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.day .wx{display:block;font-style:normal;font-size:.72rem;margin-top:2px;color:var(--ink)}
.mem img{width:100%;max-height:360px;object-fit:cover;border-radius:12px;display:block}
.memnote{margin:0;font-size:.95rem;font-style:italic}
.mem .btn input{display:none}
.card.alert{border-color:var(--tussock);background:color-mix(in srgb,var(--tussock-soft) 70%,var(--card))}
#mapview{display:flex;flex-direction:column}
#mapview .vhead h2 small{display:block}
.mapbar{padding:8px 12px 6px;display:grid;gap:6px;background:var(--paper);border-bottom:1px solid var(--line)}
.mapbar .srcseg{margin:0}
#lmap{flex:1;min-height:300px;position:relative;background:var(--water)}
#lmap .empty{padding:20px}
.mk{display:flex;align-items:center;gap:4px;white-space:nowrap;transform:translate(0,0)}
.mk .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2.5px solid #2f6b4f;flex:none}
.mk.sg .ic{border-color:#e0812a}
.mk.camp .ic{border-color:#5f7d96;border-radius:9px}
.mk.planned .ic{box-shadow:0 0 0 3px #fff,0 0 0 5px #2f6b4f}
.mk.done .ic{border-color:#9aa3a6;filter:grayscale(1);opacity:.7}
.mk.done .nm{text-decoration:line-through;color:#6b7470}
.mk .ok{position:absolute;left:19px;top:-7px;width:17px;height:17px;border-radius:50%;background:#2f8f4e;color:#fff;font:800 11px/17px var(--body);text-align:center;box-shadow:0 0 0 2px #fff}
.mpop .pill.go{background:#2f6b4f;color:#fff;border-color:#2f6b4f}.mpop .pill.warn{color:#a6432e}
.mk .dt{position:absolute;left:18px;top:-8px;background:#2f6b4f;color:#fff;font:800 9px/1 var(--body);padding:3px 5px;border-radius:6px}
.mk .nm{display:none;font:700 12px var(--body);color:#1d2621;background:rgba(255,255,255,.88);padding:2px 6px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.named .mk .nm{display:inline-block}
.me{width:22px;height:22px;border-radius:50%;background:#2b8fd6;border:3px solid #fff;box-shadow:0 0 0 2px rgba(43,143,214,.35),0 1px 4px rgba(0,0,0,.4);animation:mepulse 2s ease-out infinite}
@keyframes mepulse{0%{box-shadow:0 0 0 0 rgba(43,143,214,.55),0 1px 4px rgba(0,0,0,.4)}100%{box-shadow:0 0 0 16px rgba(43,143,214,0),0 1px 4px rgba(0,0,0,.4)}}
.mstop{width:22px;height:22px;border-radius:50%;background:#2f6b4f;color:#fff;font:800 11px/22px var(--body);text-align:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mstop.past{background:#8a958f}.mstop.cur{background:#e0812a;transform:scale(1.25)}
.mpop{display:grid;gap:4px;font:14px var(--body);min-width:180px}.mpop .muted{color:#64706a;font-size:12px}.mpop .row2{display:flex;gap:6px;margin-top:4px}
.leaflet-popup-content{margin:10px 12px}
.card.slim{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;font-size:.9rem}
.card.alert{gap:0;padding:4px 14px}
.card.alert details{padding:8px 0}.card.alert details+details{border-top:1px solid color-mix(in srgb,var(--tussock) 35%,transparent)}
.card.alert summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.card.alert summary::-webkit-details-marker{display:none}
.card.alert summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.card.alert details[open] summary::after{transform:rotate(180deg)}
.card.alert .sub{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.card.alert p.sub{margin:6px 0 8px}
.talert{background:color-mix(in srgb,var(--on-fern) 16%,transparent);border:0;border-radius:10px;padding:7px 10px;color:inherit;font:700 .85rem var(--body);text-align:left;cursor:pointer}
.sub.tide{color:var(--sea)!important;display:block;font-size:.8rem}
.tn .tsub{display:block;font:500 .76rem var(--body);opacity:.85}

.day .dt b{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.day .what{font-size:.92rem;min-width:0}

.reg{font:800 .95rem var(--display);margin:18px 0 0}
.itemr{display:flex;align-items:center;gap:2px}
.item.done .nm{text-decoration:line-through;color:var(--muted)}

.item .main{background:none;border:0;padding:11px 0;text-align:left;cursor:pointer;min-width:0}

.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .meta{font-size:.78rem;color:var(--muted)}

.fav{width:40px;height:40px;border:0;background:none;cursor:pointer;color:var(--line);font-size:1.15rem}
.fav.on{color:var(--rust)}

.end{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.end>div{display:flex;gap:8px}
label.check{display:flex;gap:10px;align-items:center;font-size:.95rem}label.check input{width:22px;height:22px}

.ok{color:var(--fern);font-weight:700}.bad{color:var(--rust);font-weight:700}

  </section>
</main>

<button class="fab" id="fab" type="button" aria-label="Add">+</button>
<div class="view" id="dayview" role="dialog" aria-modal="true" aria-label="Day" hidden></div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ================= constants & helpers ================= */
const REGIONS=["Marlborough","Nelson/Tasman","West Coast","Otago","Fiordland","Southland","Canterbury","North Island"];
const KINDS={place:"Sight",hike:"Hike",multi:"Overnight hike",bike:"MTB & bike",disc:"Disc golf",paid:"Paid activity",quirky:"Quirky",food:"Food & drink"};
const KINDS_PL={place:"Sights",hike:"Hikes",multi:"Overnight hikes",bike:"MTB & bike",disc:"Disc golf",paid:"Paid ($)",quirky:"Quirky",food:"Food"};
const CAMPTYPES={doc:"DOC pass",free:"Free (self-contained)",paid:"Paid",booked:"Booked",unknown:"To sort"};
const SHORT={doc:"DOC",free:"Free",paid:"Paid",booked:"Booked",unknown:"?"};
const KM_COST=0.38, ROAD=1.3;
const COLLS=["stops","spots","camps","nights","todos","journal"];
const COLL={stop:"stops",spot:"spots",camp:"camps"};
const state={tab:"days",stops:[],spots:[],camps:[],nights:[],todos:[],journal:[],sellAll:false,sellOpen:(()=>{try{return localStorage.getItem("sil-sellopen")==="1"}catch{return false}})(),ideasOpen:false,kind:"all",region:null,q:"",showPast:false,dview:"ahead",day:null,ideaQ:"",ideaAll:false,src:"both"};
try{const v=localStorage.getItem("sil-sug");state.src=v==="0"?"ours":v==="claude"?"claude":"both"}catch{}
const visSug=x=>state.src==="both"||(state.src==="ours"?(!x.suggested||!!x.day):!!x.suggested);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Pacific/Auckland"});
const D=d=>new Date(d+"T12:00:00");
const fmt=d=>d?D(d).toLocaleDateString("en-NZ",{day:"numeric",month:"short"}):"";
const wd=d=>D(d).toLocaleDateString("en-NZ",{weekday:"short"});
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((D(b)-D(a))/864e5);
const safeUrl=u=>/^https:\/\//i.test(u||"")?u:"";
const icon=(n,cls="svg")=>`<svg class="${cls}"><use href="#i-${n}"/></svg>`;
function toast(t,ms=2200){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,ms)}
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const hasLL=s=>typeof s.lat==="number"&&typeof s.lng==="number"&&!isNaN(s.lat)&&!isNaN(s.lng);
const sortStops=()=>[...state.stops].sort((a,b)=>(a.start||"9").localeCompare(b.start||"9")||(a.name||"").localeCompare(b.name||""));
const isPastStop=(s,t)=>s.end&&s.end>s.start?s.end<=t:(s.start||"")<t;
function currentStop(){const t=today(),st=sortStops();return st.find(s=>s.start<=t&&s.end&&t<s.end)||st.find(s=>s.start===t)||st.find(s=>s.start>t)||null}
function stopFor(d){return sortStops().find(s=>s.start&&s.start<=d&&(s.end&&s.end>s.start?d<s.end:d===s.start))}
function stopDays(s){const out=[];if(!s.start)return out;const e=s.end&&s.end>s.start?s.end:addDays(s.start,1);let d=s.start,g=0;while(d<e&&g++<60){out.push(d);d=addDays(d,1)}return out}
function nightInfo(d){const o=state.nights.find(n=>n.id===d),s=stopFor(d);
  return {date:d,stop:s,override:o,camp:(o&&o.camp!=null?o.camp:s?.camp)||"",type:(o&&o.campType?o.campType:s?.campType)||"unknown",notes:o?.notes||"",flex:!!o?.flex}}
const planFor=d=>state.spots.filter(x=>x.day===d).sort((a,b)=>(a.order??0)-(b.order??0)||(a.name||"").localeCompare(b.name||""));
function tripRange(){const st=sortStops();if(!st.length)return null;const first=st[0].start;const last=st.reduce((m,s)=>{const e=s.end||s.start;return e>m?e:m},first);return {first,last}}
function upcomingNights(){const r=tripRange();if(!r)return[];const out=[];let d=today()>r.first?today():r.first,g=0;while(d<r.last&&g++<400){out.push(d);d=addDays(d,1)}return out}
const campOf=n=>state.camps.find(c=>(c.name||"").toLowerCase()===(n.camp||"").toLowerCase())||{name:n.camp,region:n.stop?.region,type:n.type};

/* links */
const MS_INDEX="https://www.metservice.com/towns-cities";
const windyUrl=s=>`https://www.windy.com/${s.lat.toFixed(3)}/${s.lng.toFixed(3)}?${s.lat.toFixed(3)},${s.lng.toFixed(3)},10`;
const LLRE=/^\s*(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/;
const ptOf=x=>{if(hasLL(x))return x;const m=LLRE.exec(x.loc||"");return m?{lat:+m[1],lng:+m[2]}:null};
/* campsites nearest-first to a stop; ones without coordinates fall back to same region, then name */
function campsNear(st){const ref=st&&hasLL(st)?st:null;
  return state.camps.map(c=>{const p=ref&&ptOf(c);return {...c,_km:p?Math.round(hav(ref,p)*ROAD):null}})
    .sort((a,b)=>(a._km??1e6+(a.region===st?.region?0:1e5))-(b._km??1e6+(b.region===st?.region?0:1e5))||(b.fav?1:0)-(a.fav?1:0)||(a.name||"").localeCompare(b.name||""))}
const campList=st=>`<datalist id="camp-names">${campsNear(st).map(c=>`<option value="${esc(c.name)}">${c._km!=null?(c._km<5?"right here":c._km+" km"):""}</option>`).join("")}</datalist>`;
const campChips=st=>{const n=campsNear(st).filter(c=>c._km!=null&&c._km<=120).slice(0,6);return n.length?`<div class="cpick">${n.map(c=>`<button type="button" class="pill" data-pickcamp="${esc(c.name)}">${esc(c.name)} · ${c._km<5?"here":c._km+" km"}</button>`).join("")}</div>`:""};
/* the place a thing is near: the stop of its planned day, else the nearest stop to its coordinates, else its region */
const shortStop=n=>(n||"").split(/\s*(?:&|–|\/|,)\s*/)[0].trim();
function ctxName(x){let s=x.day?stopFor(x.day):null;
  if(!s){const p=ptOf(x);if(p){let bd=1e9;sortStops().forEach(st=>{if(hasLL(st)){const d=hav(st,p);if(d<bd){bd=d;s=st}}});if(bd>40)s=null}}
  return s?shortStop(s.name):(x.region||"")}
const kindLabel=x=>x.kind==="chore"?"Van chore":x.kind==="task"?"Selling the van":x.kind&&KINDS[x.kind]?KINDS[x.kind]:+x.price>0?kcat(x.cat||"activity")[1]:x.kind==="plan"?"Plan":"Sight";
function dest(x,kind){
  if(hasLL(x))return {ll:x.lat+","+x.lng};
  const m=LLRE.exec(x.loc||"");if(m)return {ll:m[1]+","+m[2]};
  const c=kind==="camp"?(x.region||""):ctxName(x);
  const base=x.loc||((x.name||"")+(kind==="camp"&&!/camp/i.test(x.name||"")?" campsite":"")+(c?", "+c:""));
  return {q:base+", New Zealand"}}
function gUrl(x,kind){const t=dest(x,kind);return "https://www.google.com/maps/dir/?api=1&destination="+(t.ll||encodeURIComponent(t.q))}
function wazeUrl(x,kind){const t=dest(x,kind);return t.ll?`https://waze.com/ul?ll=${t.ll}&navigate=yes`:`https://waze.com/ul?q=${encodeURIComponent(t.q)}&navigate=yes`}
function infoUrl(x,kind){return safeUrl(x.url)||"https://www.google.com/search?q="+encodeURIComponent((x.name||"")+" "+(kind==="camp"?(x.region||""):ctxName(x))+" New Zealand"+(kind==="hike"||(kind==="camp"&&x.type==="doc")?" DOC":""))}
const A=(href,label)=>`<a href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`;
/* one directions link: Android's geo: intent lets the phone ask which app (Maps, Waze…) to use */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
function navUrl(x,kind){const t=dest(x,kind),label=encodeURIComponent(x.name||"");
  if(IOS)return "https://maps.apple.com/?daddr="+(t.ll||encodeURIComponent(t.q));
  return t.ll?`geo:${t.ll}?q=${t.ll}(${label})`:`geo:0,0?q=${encodeURIComponent(t.q)}`}
const navLinks=(x,kind)=>`<div class="links"><a href="${esc(navUrl(x,kind))}">Directions</a>${A(infoUrl(x,kind),"Info")}</div>`;
const goBtns=(x,kind)=>`<a class="gobtn" href="${esc(navUrl(x,kind))}" aria-label="Directions to ${esc(x.name||"")}">${icon("nav")}</a>`;

/* ================= local store + sync ================= */
const LS="sil-v2",OLD="sil-plan-v1",PREV="sil-plan-prev",LS_CRED="sil-sync-v1",KEA_CRED="vanbudget.sync.v1";
let S=loadStore();
function loadStore(){let s=null;try{s=JSON.parse(localStorage.getItem(LS))}catch{}
  if(!s){s={docs:{},pending:{},lastPull:"",synced:false};
    try{const o=JSON.parse(localStorage.getItem(OLD));if(o&&o.stops)s.docs={stops:o.stops,spots:o.spots||{},camps:o.camps||{},nights:o.nights||{}}}catch{}}
  s.docs??={};COLLS.forEach(c=>s.docs[c]??={});s.pending??={};return s}
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch{toast("Phone storage is full — couldn't save")}}
function refresh(){COLLS.forEach(c=>state[c]=Object.entries(S.docs[c]).map(([id,v])=>({id,...v})));render()}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function strip(v){const o={...v};delete o.id;return o}
function put(c,id,v){S.docs[c][id]={...strip(v),by:keaMe()};S.pending[c+"/"+id]=1;persist();refresh();scheduleSync()}
function patch(c,id,p){const o=S.docs[c][id];if(!o)return;put(c,id,{...o,...p})}
function del(c,id){delete S.docs[c][id];S.pending[c+"/"+id]=1;persist();refresh();scheduleSync()}
function add(c,v){const id=newId();put(c,id,v);return id}
function replaceAll(docs){
  try{localStorage.setItem(PREV,JSON.stringify(S.docs))}catch{}
  COLLS.forEach(c=>{const nw=docs[c]||{},cur=S.docs[c];
    Object.keys(cur).forEach(id=>{if(!(id in nw)){delete cur[id];S.pending[c+"/"+id]=1}});
    Object.entries(nw).forEach(([id,v])=>{if(JSON.stringify(cur[id])!==JSON.stringify(v)){cur[id]=v;S.pending[c+"/"+id]=1}})});
  persist();refresh();scheduleSync(300)}
async function fetchPlan(){const r=await fetch("plan.json",{cache:"no-store"});if(!r.ok)throw new Error("plan");return r.json()}

let cred=loadCred(),syncing=false,syncTimer=null,lastErr=null;
function loadCred(){let c={};try{c=JSON.parse(localStorage.getItem(LS_CRED)||"{}")}catch{}
  if(c.off)return {off:true};
  if(!c.url||!c.key){try{const k=JSON.parse(localStorage.getItem(KEA_CRED)||"{}");if(k.url&&k.key)return {url:k.url,key:k.key,fromKea:true}}catch{}}
  return c}
const syncOn=()=>!!(cred.url&&cred.key);
async function api(path,opt={},c=cred){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),15000);
  try{const r=await fetch(c.url.replace(/\/+$/,"")+"/rest/v1/"+path,{...opt,signal:ac.signal,headers:{apikey:c.key,Authorization:"Bearer "+c.key,"Content-Type":"application/json",...(opt.headers||{})}});
    if(!r.ok){let b="";try{b=await r.text()}catch{}const e=new Error("HTTP "+r.status);e.status=r.status;e.body=b;throw e}
    const ct=r.headers.get("content-type")||"";return r.status===204||!ct.includes("json")?null:r.json()}
  finally{clearTimeout(t)}}
async function pullAll(since){const out=[];let off=0;
  for(;;){const rows=await api(`trip_docs?select=coll,id,data,deleted,updated_at&coll=neq.photos${since?"&updated_at=gte."+encodeURIComponent(since):""}&order=updated_at.asc,coll.asc,id.asc&limit=1000&offset=${off}`);
    out.push(...rows);if(rows.length<1000||off>60000)break;off+=1000}
  return out}
const maxTs=rows=>rows.reduce((m,r)=>r.updated_at>m?r.updated_at:m,"");
function scheduleSync(ms=1200){setChip();if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),ms)}
const missingTable=e=>e&&(e.status===404||/PGRST205|trip_docs/.test(e.body||""));
/* "Zita added Swimming pool to Wed 28 Oct" when the other phone changed the plan */
function tellChanges(list){const who=PEOPLE[list[0].by]||"The other phone",x=list[0];
  const what=x.c==="spots"?(x.del?`removed ${x.d.name||"a plan"}`:!x.was&&x.d.day?`added ${x.d.name} to ${wd(x.d.day)} ${fmt(x.d.day)}`:x.d.day&&x.was?.day!==x.d.day?`moved ${x.d.name} to ${wd(x.d.day)} ${fmt(x.d.day)}`:x.d.done&&!x.was?.done?`ticked off ${x.d.name}`:`changed ${x.d.name||"a place"}`)
    :x.c==="stops"?`changed ${x.d.name||"a stop"}`:x.c==="nights"?"changed a campsite":x.c==="journal"?`added a memory for ${wd(x.d.date||"")} ${fmt(x.d.date||"")}`:"changed the plan";
  toast(`${who} ${what}${list.length>1?` (+${list.length-1} more)`:""}`,5000)}
async function sync(manual){
  if(!syncOn()||syncing)return setChip();
  if(!navigator.onLine){if(manual)toast("No signal — changes stay on this phone until you're back online");return setChip()}
  syncing=true;setChip("Syncing…");
  try{
    if(!S.synced){
      const probe=await api("trip_docs?select=id&limit=1");
      if(probe.length){
        try{localStorage.setItem(PREV,JSON.stringify(S.docs))}catch{}
        const all=await pullAll("");const docs={stops:{},spots:{},camps:{},nights:{},todos:{},journal:{}};
        all.forEach(r=>{if(!r.deleted&&docs[r.coll])docs[r.coll][r.id]=r.data});
        S.docs=docs;S.pending={};S.lastPull=maxTs(all);S.synced=true;persist();refresh();
        toast("Shared plan loaded");return;
      }
      if(!Object.keys(S.docs.stops).length){try{const p=await fetchPlan();COLLS.forEach(c=>S.docs[c]=p[c]||{})}catch{}}
      COLLS.forEach(c=>Object.keys(S.docs[c]).forEach(id=>S.pending[c+"/"+id]=1));
      S.synced=true;persist();refresh();
    }
    const keys=Object.keys(S.pending);
    for(let i=0;i<keys.length;i+=200){
      const chunk=keys.slice(i,i+200),sent={};
      const body=chunk.map(k=>{const j=k.indexOf("/"),c=k.slice(0,j),id=k.slice(j+1),v=S.docs[c]?.[id];sent[k]=JSON.stringify(v??null);return {coll:c,id,data:v||{},deleted:!v}});
      await api("trip_docs?on_conflict=coll,id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(body)});
      chunk.forEach(k=>{const j=k.indexOf("/");if(JSON.stringify(S.docs[k.slice(0,j)]?.[k.slice(j+1)]??null)===sent[k])delete S.pending[k]});
      persist();
    }
    const rows=await pullAll(S.lastPull);let changed=false;
    const me=keaMe(),theirs=[];
    rows.forEach(r=>{const k=r.coll+"/"+r.id;if(S.pending[k]||!S.docs[r.coll])return;
      if(r.deleted){if(r.id in S.docs[r.coll]){const o=S.docs[r.coll][r.id];delete S.docs[r.coll][r.id];changed=true;if(o?.by&&o.by!==me)theirs.push({by:o.by,c:r.coll,d:o,del:true})}}
      else if(JSON.stringify(S.docs[r.coll][r.id])!==JSON.stringify(r.data)){const was=S.docs[r.coll][r.id];S.docs[r.coll][r.id]=r.data;changed=true;if(r.data.by&&r.data.by!==me)theirs.push({by:r.data.by,c:r.coll,d:r.data,was})}});
    const m=maxTs(rows);if(m)S.lastPull=m;persist();if(changed)refresh();
    if(theirs.length&&S.lastPull&&!manual)tellChanges(theirs);
    syncPhotos();
    lastErr=null;if(manual)toast("Synced");
  }catch(e){lastErr=e;console.warn("sync",e);if(manual)toast(missingTable(e)?"The shared table isn't set up yet — see ⋯":"Sync failed — will retry")}
  finally{syncing=false;setChip()}
}

function setChip(busy){const c=$("#sync");
  let cls="",label="Saved on this phone only";
  if(syncOn()){const p=Object.keys(S.pending).length;
    if(busy){cls="wait";label="Syncing…"}
    else if(!navigator.onLine){cls="wait";label=p?`Offline — ${p} change${p>1?"s":""} waiting`:"Offline"}
    else if(lastErr){cls="err";label="Sync problem — tap to fix"}
    else if(p){cls="wait";label=`${p} change${p>1?"s":""} waiting`}
    else{cls="on";label="Synced with your partner's phone"}}
  c.className="dot "+cls;c.setAttribute("aria-label",label);c.title=label}

/* ================= map ================= */
const COAST=[[-40.5,172.65],[-40.68,172.7],[-40.8,173.0],[-41.05,173.05],[-41.27,173.28],[-41.0,173.6],[-40.82,173.85],[-40.99,174.31],[-41.27,174.3],[-41.73,174.28],[-42.1,173.95],[-42.42,173.7],[-42.85,173.3],[-43.15,172.8],[-43.53,172.75],[-43.6,173.0],[-43.75,173.12],[-43.88,172.85],[-43.85,172.4],[-44.1,171.8],[-44.4,171.27],[-44.75,171.15],[-45.1,170.97],[-45.5,170.75],[-45.88,170.6],[-46.2,170.15],[-46.45,169.81],[-46.6,169.4],[-46.67,169.0],[-46.6,168.33],[-46.36,168.0],[-46.25,167.4],[-46.16,166.6],[-45.7,166.65],[-45.25,166.85],[-44.95,167.3],[-44.6,167.8],[-44.25,168.2],[-43.98,168.6],[-43.88,169.0],[-43.6,169.6],[-43.4,169.82],[-43.22,170.16],[-42.95,170.65],[-42.72,170.96],[-42.45,171.2],[-42.1,171.33],[-41.75,171.6],[-41.5,171.9],[-41.25,172.1],[-41.1,172.1],[-40.78,172.22],[-40.65,172.43]];
const LAT0=-40.35,LAT1=-46.85,LNG0=166.3,LNG1=174.6,W=400,H=470,kx=Math.cos(43.6*Math.PI/180);
const scale=Math.min((W-20)/((LNG1-LNG0)*kx),(H-20)/(LAT0-LAT1));
const P=(lat,lng)=>[10+(lng-LNG0)*kx*scale,10+(LAT0-lat)*scale];
/* road distance between consecutive stops: real driving km from OSRM once fetched, a rough estimate until then */
const RK="sil-roads";let roads={};try{roads=JSON.parse(localStorage.getItem(RK))||{}}catch{}
const legKey=(a,b)=>`${(+a.lat).toFixed(3)},${(+a.lng).toFixed(3)};${(+b.lat).toFixed(3)},${(+b.lng).toFixed(3)}`;
function legs(){const st=sortStops();return st.map((s,i)=>!i||!hasLL(s)||!hasLL(st[i-1])?0:roads[legKey(st[i-1],s)]??Math.round(hav(st[i-1],s)*ROAD))}
function legReal(i){const st=sortStops();return i>0&&hasLL(st[i])&&hasLL(st[i-1])&&legKey(st[i-1],st[i]) in roads}
let roadBusy=false;
async function pullRoads(){if(roadBusy||!navigator.onLine)return;roadBusy=true;let changed=false;
  try{const st=sortStops().filter(hasLL);
    for(let i=1;i<st.length;i++){const a=st[i-1],b=st[i],k=legKey(a,b);if(k in roads)continue;
      try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`);
        if(!r.ok)break;const j=await r.json();if(j.routes&&j.routes[0]){roads[k]=Math.round(j.routes[0].distance/1000);changed=true}}catch{break}
      await new Promise(r=>setTimeout(r,250))}}
  finally{roadBusy=false}
  if(changed){try{localStorage.setItem(RK,JSON.stringify(roads))}catch{}render()}}
function mapSvg(){
  const t=today(),stops=sortStops().filter(hasLL),cur=currentStop();
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of your route"><rect width="${W}" height="${H}" fill="var(--water)"/><polygon points="${COAST.map(c=>P(...c).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="var(--land)" stroke="var(--line)" stroke-width="1.2" stroke-linejoin="round"/>`;
  if(stops.length>1){const past=[],fut=[];stops.forEach(st=>(isPastStop(st,t)?past:fut).push(P(st.lat,st.lng)));
    if(past.length&&fut.length)fut.unshift(past[past.length-1]);
    if(past.length>1)s+=`<polyline points="${past.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>`;

async function pullWx(){if(wxBusy||!navigator.onLine)return;wxBusy=true;const t=today(),until=addDays(t,13);let changed=false;

      wx[k]={at:Date.now(),days};changed=true}catch{}}
    Object.keys(wx).forEach(k=>{if(Date.now()-wx[k].at>14*864e5)delete wx[k]});
    if(changed){try{localStorage.setItem(WXK,JSON.stringify(wx))}catch{}render()}}finally{wxBusy=false}}

function moveNight(d,toId,force){

  if(stopDays(A).length<2)return toast(`${A.name} needs at least one night`),false;
  if(j<i&&B.end<=t)return toast(`${B.name} is already behind you`),false;
  for(let k=lo;k<hi;k++)if(st[k].end!==st[k+1].start)return toast("There's a gap between those stops, change dates by hand"),false;

  Object.entries(D.spots).forEach(([id,x])=>{if(x.day===d){D.spots[id]={...x,day:null,order:null};mark("spots",id)}});
  const fx=D.nights[d];if(fx){delete D.nights[d];mark("nights",d)}

    if(D.nights[x]){D.nights[y]=D.nights[x];delete D.nights[x];mark("nights",x);mark("nights",y)}};

  document.addEventListener("contextmenu",e=>{if(drag||e.target.closest?.("[data-flexd]"))e.preventDefault()});
  document.addEventListener("click",e=>{if(eatClick){e.stopPropagation();e.preventDefault();eatClick=false}},true)})();
function setNight(d,camp,type,notes,flex){const s=stopFor(d);

  if(type==="newplan"){const d=id,name=v.name;

    openSpot({id:nid,...S.docs.spots[nid]},true);return}
  if(type==="paid"){const x=S.docs.spots[id];if(!x)return closeSheet();
    const amt=parseFloat(String(v.amount||"").replace(",","."));if(!(amt>0)){toast("Enter an amount");return}
    const keaId=x.keaId||newId(),meta={payer:v.payer||keaMe(),account:v.account||"",personal:v.personal||""};
    const nx={...x,price:Math.round(amt*100)/100,cat:v.cat||"activity",done:true,paid:true,keaId,keaMeta:meta};
    S.docs.spots[id]=nx;S.pending["spots/"+id]=1;persist();refresh();scheduleSync();
    keaWrite(keaRec(nx,meta));
    try{const k=keaLocal();if(k&&k.settings&&meta.account){k.settings.lastAccount=meta.account;localStorage.setItem(KEA_LS,JSON.stringify(k))}}catch{}
    closeSheet();toast(`Logged ${nzd(amt)} in Kea`);return}
  if(type==="night"){
    if(v.all){const s=stopFor(id);patch("stops",s.id,{camp:v.camp,campType:v.campType});stopDays(s).forEach(d=>{const o=S.docs.nights[d];if(!o)return;if(o.flex&&d!==id)put("nights",d,{camp:v.camp,campType:v.campType,notes:"",flex:true});else del("nights",d)});if(v.notes||v.flex)setNight(id,v.camp,v.campType,v.notes,!!v.flex)}
    else setNight(id,v.camp,v.campType,v.notes,!!v.flex);
    closeSheet();toast("Saved");return}
  if(type==="stop"){if(!v.start){toast("Pick an arrival date");return}
    v.book=!!v.book;v.booked=!!v.booked;v.lead=+v.lead||14;
    const num=x=>x===""||x==null?null:parseFloat(String(x).replace(",","."));v.lat=num(v.lat);v.lng=num(v.lng);v.imin=num(v.imin);v.imax=num(v.imax);if(v.imin!=null&&v.imax!=null&&v.imax<v.imin)v.imax=v.imin;if(v.end&&v.end<v.start)v.end=v.start}
  const c=COLL[type],prev=id?S.docs[c][id]:null,doc={...(prev||{}),...v};
  if(!id&&type==="spot"){doc.fav=false;doc.done=false;doc.day=v.day||null;if(doc.day)doc.order=planFor(doc.day).length}
  if(!id&&type==="camp")doc.fav=false;
  if(id)put(c,id,doc);else add(c,doc);
  closeSheet();toast(id?"Saved":"Added")});

const SQL=`create table if not exists trip_docs (
  coll text not null, id text not null,
  data jsonb not null default '{}'::jsonb,
  deleted boolean not null default false,
  updated_at timestamptz not null default now(),
  primary key (coll, id));
create index if not exists trip_docs_updated on trip_docs (updated_at);
create or replace function trip_docs_touch() returns trigger
  language plpgsql set search_path = '' as $$
  begin new.updated_at := now(); return new; end $$;
drop trigger if exists trip_docs_touch on trip_docs;
create trigger trip_docs_touch before insert or update on trip_docs
  for each row execute function trip_docs_touch();
alter table trip_docs enable row level security;
drop policy if exists trip_docs_all on trip_docs;
create policy trip_docs_all on trip_docs for all to anon using (true) with check (true);
grant select, insert, update, delete on trip_docs to anon;`;
function backupBlob(){return new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),...S.docs})],{type:"application/json"})}
function downloadBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(backupBlob());a.download=`aotearoa-loop-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Backup saved to Downloads")}
async function shareBackup(){const f=new File([backupBlob()],`aotearoa-loop-${today()}.json`,{type:"application/json"});try{await navigator.share({files:[f],title:"Aotearoa Loop backup"})}catch(e){if(e&&e.name!=="AbortError")downloadBackup()}}

/* ---- check coordinates against OpenStreetMap (Nominatim), then let us approve the fixes ---- */
let geoRun=null;
function geoName(n){return (n||"").replace(/\s*\(.*?\)\s*/g," ").replace(/[’]/g,"'").split(/\s*[·–]\s*|,/)[0].trim()}
async function geoLookup(q,near){const p=new URLSearchParams({q:q+", New Zealand",format:"jsonv2",limit:"5",countrycodes:"nz"});
  if(near)p.set("viewbox",`${near.lng-1.5},${near.lat+1.2},${near.lng+1.5},${near.lat-1.2}`);
  const r=await fetch("https://nominatim.openstreetmap.org/search?"+p,{headers:{"Accept-Language":"en"}});if(!r.ok)throw new Error("osm "+r.status);return r.json()}
async function geoCheck(){const out=$("#geo-out");if(geoRun)return;geoRun={stop:false,fixes:[],missing:[]};
  let lock=null;const wake=async()=>{try{lock=await navigator.wakeLock?.request("screen")}catch{}};await wake();
  const onVis=()=>{if(document.visibilityState==="visible"&&geoRun&&(!lock||lock.released))wake()};document.addEventListener("visibilitychange",onVis);
  const items=[...state.spots.filter(x=>!["chore","task","plan"].includes(x.kind)).map(x=>({c:"spots",x})),...state.camps.map(x=>({c:"camps",x}))]
    .filter(({x})=>x.name&&!x.llok);
  let i=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  for(const it of items){if(geoRun.stop)break;i++;const x=it.x,cur=ptOf(x);
    if(out)out.innerHTML=`<div class="muted" style="font-size:.85rem">Checking ${i} of ${items.length}: ${esc(x.name)}…${"wakeLock" in navigator?" · screen stays on":""} <button type="button" class="pill" id="geo-stop">Stop</button></div>`;
    $("#geo-stop")&&($("#geo-stop").onclick=()=>geoRun.stop=true);
    let hits=[];const names=[...new Set([x.osm,x.name.replace(/\s*\(.*?\)\s*/g," ").trim(),geoName(x.name)].filter(Boolean))];
    for(const q of names){try{hits=await geoLookup(q,cur)}catch{}await sleep(1100);if(hits.length)break}
    // second opinion from Photon (fuzzier matching on the same OpenStreetMap data)
    if(!hits.length){try{const p=new URLSearchParams({q:names[0],limit:"5"});if(cur){p.set("lat",cur.lat);p.set("lon",cur.lng)}
      const r=await fetch("https://photon.komoot.io/api/?"+p);if(r.ok){const j=await r.json();hits=(j.features||[]).filter(f=>f.properties?.country==="New Zealand"||f.properties?.countrycode==="NZ").map(f=>({lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],display_name:[f.properties.name,f.properties.city||f.properties.county||f.properties.state].filter(Boolean).join(", ")}))}}catch{}await sleep(600)}
    if(!hits.length){geoRun.missing.push(it);continue}
    // pick the match nearest our current guess (or the most important if we have none), but never one 150+ km away from it
    const scored=hits.map(h=>({h,ll:{lat:+h.lat,lng:+h.lon}})).map(o=>({...o,d:cur?hav(cur,o.ll):0}));
    scored.sort((a,b)=>a.d-b.d);const best=scored[0];
    if(cur&&best.d>150){geoRun.missing.push(it);continue}
    if(!cur||best.d>2)geoRun.fixes.push({...it,ll:best.ll,d:cur?Math.round(best.d):null,osm:String(best.h.display_name).split(",").slice(0,2).join(","),on:true})}
  const F=geoRun.fixes,M=geoRun.missing;geoRun=null;try{lock?.release()}catch{}document.removeEventListener("visibilitychange",onVis);
  if(!out)return;
  out.innerHTML=`<div style="display:grid;gap:6px;font-size:.85rem">
    <b>${F.length} to fix${M.length?` · ${M.length} not found in OpenStreetMap`:""}</b>
    ${F.map((f,k)=>`<label class="check" style="align-items:flex-start"><input type="checkbox" data-geofix="${k}" checked><span><b>${esc(f.x.name)}</b> ${f.d!=null?`moves ${f.d} km`:"gets a position"}<br><span class="muted">${esc(f.osm)}</span></span></label>`).join("")}
    ${F.length?`<button type="button" class="btn primary" id="geo-apply">Apply ${F.length} fixes</button>`:`<span class="muted">Everything looks right.</span>`}
    ${M.length?`<details><summary class="muted">Not found (${M.length})</summary><div class="muted">${M.map(m=>esc(m.x.name)).join(" · ")}</div></details>`:""}</div>`;
  const ap=$("#geo-apply");if(ap)ap.onclick=()=>{let n=0;out.querySelectorAll("[data-geofix]").forEach(cb=>{if(!cb.checked)return;const f=F[+cb.dataset.geofix],o=S.docs[f.c][f.x.id];if(!o)return;
      S.docs[f.c][f.x.id]={...o,lat:+f.ll.lat.toFixed(5),lng:+f.ll.lng.toFixed(5),by:keaMe()};S.pending[f.c+"/"+f.x.id]=1;n++});
    persist();refresh();scheduleSync();toast(`Updated ${n} positions`);out.innerHTML=`<span class="muted">Updated ${n} positions.</span>`}}
function openSettings(){
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[new File(["{}"],"x.json",{type:"application/json"})]}));
  let prev=false;try{prev=!!localStorage.getItem(PREV)}catch{}
  const p=Object.keys(S.pending).length,need=lastErr&&missingTable(lastErr);
  const status=!syncOn()?`<span class="muted">Only on this phone.</span>`
    :need?`<span class="bad">One step left: create the shared table.</span>`
    :lastErr?`<span class="bad">Can't reach the database right now. It retries by itself.</span>`
    :`<span class="ok">✓ Shared${p?` · ${p} waiting`:""}</span>`;
  sheet(head("Settings")+`
    <span class="label">Sharing</span>${status}
    <div id="s-sql" ${need?"":"hidden"} style="display:grid;gap:8px">
      <span style="font-size:.9rem">Copy this, paste it in <b>Supabase → SQL Editor</b> and press <b>Run</b>. Then tap Test.</span>
      <div class="row2"><button type="button" class="btn primary" id="s-copy">Copy SQL</button><button type="button" class="btn" id="s-retest">Test</button></div>
      <pre class="sql">${esc(SQL)}</pre></div>
    <details ${syncOn()?"":"open"}><summary>Connection</summary><div>
      <label>Supabase URL<input id="s-url" type="url" value="${esc(cred.url||"")}" placeholder="https://xxxx.supabase.co" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label>Anon key<input id="s-key" value="${esc(cred.key||"")}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <span class="muted" style="font-size:.8rem">${cred.fromKea?"Taken from Kea on this phone.":"Same details as in Kea."}</span>
      <div class="row2"><button type="button" class="btn primary" id="s-test">Save &amp; test</button>${syncOn()?`<button type="button" class="btn" id="s-off">Stop sharing</button>`:""}</div>
      <div id="s-msg"></div></div></details>
    <span class="label" style="margin-top:6px">Backup</span>
    <div class="row2">${canShare?`<button type="button" class="btn" id="s-share">Share file</button>`:""}<button type="button" class="btn" id="s-dl">Save file</button></div>
    <label>Restore<input type="file" id="s-file" accept=".json,application/json"></label>
    ${prev?`<button type="button" class="btn" id="s-undo">Undo last restore</button>`:""}
    <details><summary>Check map positions</summary><div style="display:grid;gap:8px">
      <p class="muted" style="margin:0;font-size:.85rem">Places already checked by hand are skipped. Looks the rest up in OpenStreetMap (about one per second, so a few minutes with the screen on) and suggests fixes for ones that are off. Nothing changes until you tap Apply.</p>
      <button type="button" class="btn" id="geo-go">Start checking</button><div id="geo-out"></div></div></details>
    <a class="btn" href="../">Open Kea</a>`,"settings");
  const test=async(url,key)=>{const msg=$("#s-msg");msg.innerHTML=`<span class="muted">Testing…</span>`;
    try{await api("trip_docs?select=id&limit=1",{},{url,key});const changed=url!==cred.url||key!==cred.key;cred={url,key};try{localStorage.setItem(LS_CRED,JSON.stringify(cred))}catch{}
      if(changed){S.synced=false;S.lastPull=""}lastErr=null;persist();msg.innerHTML=`<span class="ok">✓ Connected</span>`;$("#s-sql").hidden=true;sync(true)}
    catch(e){if(missingTable(e)){cred={url,key};try{localStorage.setItem(LS_CRED,JSON.stringify(cred))}catch{}lastErr=e;msg.innerHTML=`<span class="bad">Connected, table missing.</span>`;$("#s-sql").hidden=false}
      else msg.innerHTML=`<span class="bad">${e.status===401||e.status===403?"Key rejected — use the anon key.":"Couldn't connect — check the URL and signal."}</span>`;setChip()}};
  $("#s-test").onclick=()=>{const url=$("#s-url").value.trim(),key=$("#s-key").value.trim();if(!/^https?:\/\/.+/.test(url)||!key){$("#s-msg").innerHTML=`<span class="bad">Fill in both.</span>`;return}test(url,key)};
  $("#s-retest").onclick=()=>{if(syncOn()){$("#form details").open=true;test(cred.url,cred.key)}};
  $("#s-copy").onclick=async e=>{try{await navigator.clipboard.writeText(SQL);e.target.textContent="Copied ✓"}catch{const r=document.createRange();r.selectNodeContents($(".sql"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected — copy it from the menu")}};
  $("#s-off")?.addEventListener("click",()=>{cred={off:true};try{localStorage.setItem(LS_CRED,JSON.stringify(cred))}catch{}S.synced=false;S.lastPull="";persist();setChip();closeSheet();toast("Sharing off")});
  $("#s-dl").onclick=downloadBackup;if($("#s-share"))$("#s-share").onclick=shareBackup;
  $("#s-file").onchange=async e=>{const file=e.target.files[0];if(!file)return;
    try{const d=JSON.parse(await file.text());if(!d||typeof d.stops!=="object")throw 0;replaceAll(d);closeSheet();toast("Restored")}catch{toast("That's not a plan file")}};
  armed($("#s-undo"),"Tap again to undo",()=>{try{replaceAll(JSON.parse(localStorage.getItem(PREV)));localStorage.removeItem(PREV);closeSheet();toast("Undone")}catch{toast("Nothing to undo")}})}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||(b.closest("#form")&&b.type==="submit"))return;
  const ds=b.dataset;
  if(ds.tab){state.tab=ds.tab;document.querySelectorAll(".seg button").forEach(t=>t.setAttribute("aria-selected",t===b));
    $("#days").hidden=ds.tab!=="days";$("#places").hidden=ds.tab!=="places";
    try{localStorage.setItem("sil-tab",ds.tab)}catch{}window.scrollTo(0,0);if(ds.tab==="days")requestAnimationFrame(drawRoad)}
  else if(ds.close==="day")closeDay();
  else if(ds.close==="map")closeMap();
  else if("newplan" in ds)openNewPlan(ds.newplan||state.day);
  else if(ds.memedit)openMemNote(ds.memedit);
  else if(b.id==="geo-go")geoCheck();
  else if(ds.msrc){state.src=ds.msrc;try{localStorage.setItem("sil-sug",{both:"1",ours:"0",claude:"claude"}[ds.msrc])}catch{}renderMapBar();drawMarkers();renderPlaces()}
  else if(ds.skip){const x=S.docs.spots[ds.skip];if(!x)return;keaUnpay(ds.skip,true);if(x.kind==="plan"||x.kind==="chore")del("spots",ds.skip);else patch("spots",ds.skip,{day:null,order:null});toast("Back in your ideas")}
  else if("reviewall" in ds){state.reviewAll=true;renderDays()}
  else if("mdonetog" in ds){state.mapDone=state.mapDone===false;renderMapBar();drawMarkers()}
  else if(ds.mdone){lmap?.closePopup();const x=S.docs.spots[ds.mdone];if(x)setDone(ds.mdone,!x.done)}
  else if(ds.mdel){if(!b.dataset.armed){b.dataset.armed=1;b.textContent="Tap again to remove";return}
    const [t,id]=ds.mdel.split(":"),c=t==="camp"?"camps":"spots",nm=S.docs[c][id]?.name||"";lmap?.closePopup();if(c==="spots")keaUnpay(id,true);del(c,id);toast(`Removed ${nm}`)}
  else if(ds.mkind){state.mapKind=ds.mkind;renderMapBar();drawMarkers()}
  else if(b.id==="locme")locate(true);
  else if(ds.hidealert){const h=hiddenAlerts();h[ds.hidealert]=1;try{localStorage.setItem(HIDK,JSON.stringify(h))}catch{}render();toast("Alert hidden")}
  else if("sellopen" in ds){state.sellOpen=!state.sellOpen;try{localStorage.setItem("sil-sellopen",state.sellOpen?"1":"0")}catch{}renderExtras()}
  else if("sellall" in ds){state.sellAll=!state.sellAll;renderExtras()}
  else if(ds.chore){addChore($("#form").dataset.id||state.day,ds.chore);closeSheet()}
  else if("todaymore" in ds){state.todayOpen=!state.todayOpen;renderToday()}
  else if(ds.day)openDay(ds.day);
  else if(ds.unplan){const x=S.docs.spots[ds.unplan],had=keaUnpay(ds.unplan,true);
    if(x?.kind==="plan"||x?.kind==="chore"){del("spots",ds.unplan);toast(`Removed ${x.name||""}${had?" and from Kea":""}`);return}
    patch("spots",ds.unplan,{day:null,order:null,done:false});toast(`Removed ${x?.name||""} from this day${had?" and from Kea":""}`)}
  else if(ds.plan){const d=state.day;patch("spots",ds.plan,{day:d,order:planFor(d).length});toast("Added")}
  else if(ds.open){const [t,id]=ds.open.split(":"),it=S.docs[COLL[t]][id];if(it)(t==="spot"?openSpot:t==="stop"?openStop:openCamp)({id,...it})}
  else if(ds.edit){const [t,id]=ds.edit.split(":"),it=S.docs[COLL[t]][id];if(it)openStop({id,...it})}
  else if(ds.tog){const [c,f,id]=ds.tog.split(":"),it=S.docs[c][id];if(!it)return;if(c==="spots"&&f==="done")setDone(id,!it.done);else patch(c,id,{[f]:!it[f]})}
  else if(ds.night)openNight(ds.night);
  else if(ds.src){state.src=ds.src;try{localStorage.setItem("sil-sug",{both:"1",ours:"0",claude:"claude"}[ds.src])}catch{}renderPlaces();renderIdeas()}
  else if(ds.kind){state.kind=ds.kind;renderPlaces()}
  else if(ds.dview){state.dview=ds.dview;renderExtras();renderDays();scrollTo(0,0)}
  else if(ds.booked){const [c,id]=ds.booked.split(":");patch(c==="stop"?"stops":"spots",id,{booked:true});toast("Booked ✓")}
  else if(ds.todo){const x=S.docs.todos[ds.todo];if(x)patch("todos",ds.todo,{done:!x.done})}
  else if("cleartodos" in ds){Object.entries(S.docs.todos).filter(([,x])=>x.done).forEach(([id])=>{delete S.docs.todos[id];S.pending["todos/"+id]=1});persist();refresh();scheduleSync();toast("Cleared")}
  else if("openideas" in ds){state.ideasOpen=!state.ideasOpen;renderDay()}
  else if("ideaall" in ds){state.ideaAll=true;renderIdeas()}
});

setTimeout(()=>$("#splash")?.remove(),2400);
(async()=>{

  if(!Object.keys(S.docs.stops).length){try{const p=await fetchPlan();COLLS.forEach(c=>S.docs[c]=p[c]||{});persist();refresh()}catch{toast("Couldn't load the plan — connect once and reopen")}}
