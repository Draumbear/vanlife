<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="description" content="Our South Island campervan route, campsites and day plans. Works offline.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>South Island Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first field notebook. Sticky header with trip progress, three tabs (Route / Places / Camps), bottom sheet for editing. */
:root{
  --paper:#f3f4ee; --card:#fbfbf7; --ink:#1d2621; --muted:#5f6b63; --line:#d9ddd2;
  --fern:#2f6b4f; --fern-soft:#dbe9df; --tussock:#b8761f; --tussock-soft:#f3e3c8;
  --sea:#2b6f86; --sea-soft:#d6e8ee; --rust:#a6432e; --rust-soft:#f2dcd5;
  --land:#e4e8dc; --water:#dfe9ec;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a17; --card:#1b231f; --ink:#e7ece6; --muted:#9aa79f; --line:#2c3732;
  --fern:#7cc49b; --fern-soft:#1f3a2c; --tussock:#e2a552; --tussock-soft:#3a2c17;
  --sea:#79bdd3; --sea-soft:#183139; --rust:#e58a73; --rust-soft:#3d2119;
  --land:#232e29; --water:#16232a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#141a17; --card:#1b231f; --ink:#e7ece6; --muted:#9aa79f; --line:#2c3732;
  --fern:#7cc49b; --fern-soft:#1f3a2c; --tussock:#e2a552; --tussock-soft:#3a2c17;
  --sea:#79bdd3; --sea-soft:#183139; --rust:#e58a73; --rust-soft:#3d2119;
  --land:#232e29; --water:#16232a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:800 1.6rem/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--line);border-radius:3px;margin:10px 0 0;overflow:hidden}
.progress span{display:block;height:100%;background:var(--fern)}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:700 .95rem var(--body);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--tussock)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
section{padding-top:16px}
.banner{background:var(--tussock-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.92rem;margin-bottom:14px}
/* map */
.mapcard{background:var(--water);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapcard svg{display:block;width:100%;height:auto;max-height:520px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font:800 1.25rem var(--display)}
.stat small{color:var(--muted);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}
/* timeline */
.group-h{font:800 .78rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.stop{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.stop.now{background:var(--fern-soft);border-radius:10px;padding:12px;border-top:0;margin:4px 0}
.stop.past{opacity:.6}
.dates{font:500 .82rem/1.35 var(--mono);color:var(--muted)}
.dates b{display:block;color:var(--ink);font-weight:500}
.stop h3{font:700 1.05rem/1.25 var(--display);margin:0}
.stop p{margin:4px 0 0;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.c-doc{background:var(--fern-soft);color:var(--fern)} .c-free{background:var(--sea-soft);color:var(--sea)}
.c-paid{background:var(--tussock-soft);color:var(--tussock)} .c-booked{background:var(--rust-soft);color:var(--rust)}
.leg{grid-column:2 / -1;font:500 .75rem var(--mono);color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lk{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;color:var(--sea);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;min-height:34px}
.lk:hover{border-color:var(--sea)}
.lk.sm{margin-top:4px;padding:3px 8px;min-height:0;font-size:.78rem}
.nowcard{background:var(--fern-soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.nowcard h2{font:800 1.4rem/1.15 var(--display);margin:2px 0 4px}
.now-k{font:800 .75rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--fern)}
.now-p{margin:6px 0 0;font-size:.92rem}
.night{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 6px;color:var(--ink);font:inherit;cursor:pointer}
.night:hover{background:var(--card)}
.night.tonight{background:var(--fern-soft);border-radius:10px;border-top-color:transparent}
.night.past{opacity:.55}
.nd{font:500 .85rem var(--mono);font-variant-numeric:tabular-nums}.nd b{font-weight:500;color:var(--muted);margin-right:4px}
.nc{display:grid;min-width:0}
.ncamp{font-weight:700;overflow-wrap:anywhere}.ncamp i{color:var(--rust);font-weight:400}
.nstop{color:var(--muted);font-size:.82rem}
.tonight-camp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:1.05rem;margin-top:6px}
label.check{display:flex;gap:8px;align-items:center;font-weight:400}label.check input{width:auto}
.dayview{position:fixed;inset:0;z-index:15;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.dayhead{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line)}
.dayhead .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.dayhead h2{flex:1;min-width:0;font:800 1.15rem/1.2 var(--display);margin:0;text-align:center;text-wrap:balance}
.daybody{display:grid;gap:14px;padding-block:14px 48px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.panel h3{font:800 .78rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.panel p.note{margin:6px 0 0}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0;padding-top:4px}
.act.done .name{text-decoration:line-through;color:var(--muted)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.mv button:disabled{opacity:.35;cursor:default}
.addrow{display:flex;gap:8px;margin-top:12px}.addrow input{flex:1;min-width:0}
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.daychips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.daychip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font:700 .78rem var(--body);color:var(--ink);cursor:pointer}
.daychip.today{background:var(--fern);color:var(--paper);border-color:var(--fern)}
.daychip span{font-family:var(--mono);color:var(--tussock);margin-left:4px}
.daychip.today span{color:var(--paper)}
button.lk{cursor:pointer;font-family:var(--body)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;min-width:40px;height:40px;color:var(--muted);cursor:pointer;font-size:1rem}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
/* filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:thin}
.pill{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:700 .85rem var(--body);color:var(--muted);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row.done .name{text-decoration:line-through;color:var(--muted)}
.row .name{font-weight:700}
.row .note{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.kind{font:500 .7rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toggles{display:flex;gap:4px}
.tg{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.05rem;color:var(--muted)}
.tg.on.fav{color:var(--rust);border-color:var(--rust);background:var(--rust-soft)}
.tg.on.chk{color:var(--fern);border-color:var(--fern);background:var(--fern-soft)}
.region-h{font:800 1.05rem var(--display);margin:20px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.region-h span{font:500 .75rem var(--mono);color:var(--muted)}
.empty{color:var(--muted);padding:24px 0;text-align:left}
/* fab + sheet */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--tussock);color:#fff;border:0;border-radius:999px;padding:14px 20px;font:700 1rem var(--body);box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:620px;margin:0 auto;display:grid;gap:12px}
.sheet h2{font:800 1.3rem var(--display);margin:0}
label{display:grid;gap:4px;font-weight:700;font-size:.85rem}
input,select,textarea{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:11px 16px;font:700 .95rem var(--body);cursor:pointer}
.btn.primary{background:var(--fern);border-color:var(--fern);color:var(--paper)}
.btn.danger{color:var(--rust);border-color:var(--rust)}
.hint{color:var(--muted);font-size:.8rem;font-weight:400}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;font-size:.9rem}
@media (max-width:420px){.stop{grid-template-columns:62px minmax(0,1fr) auto;gap:10px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>


<header><div class="wrap" style="padding-block:0">
  <div class="top"><h1>South Island Loop</h1><div style="display:flex;align-items:center;gap:10px"><span class="sub mono" id="dayline">8 Oct → Picton ferry</span><button class="icon-btn" id="menu" type="button" aria-label="Backup and settings">⋯</button></div></div>
  <div class="progress" aria-hidden="true"><span id="bar" style="width:0%"></span></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-route" aria-selected="true" data-tab="route">Route</button>
    <button class="tab" role="tab" id="t-nights" aria-selected="false" data-tab="nights">Nights</button>
    <button class="tab" role="tab" id="t-spots" aria-selected="false" data-tab="spots">Places</button>
    <button class="tab" role="tab" id="t-camps" aria-selected="false" data-tab="camps">Campsites</button>
  </nav>
</div></header>

<main class="wrap">
  <div id="notice" class="banner" hidden></div>

  <section id="route">
    <div class="nowcard" id="nowcard" hidden></div>
    <div class="mapcard"><svg id="map" viewBox="0 0 400 470" role="img" aria-label="Map of the South Island with your stops"></svg></div>
    <div class="stats">
      <div class="stat"><small>Stops</small><b class="mono" id="s-stops">–</b></div>
      <div class="stat"><small>Est. km</small><b class="mono" id="s-km">–</b></div>
      <div class="stat"><small>Diesel + RUC</small><b class="mono" id="s-cost">–</b></div>
    </div>
    <div id="timeline"><p class="empty">Loading your route…</p></div>
  </section>

  <section id="nights" hidden>
    <p class="sub" style="margin:0 0 10px">Where you sleep each night. Tap a night to open that day: campsite, plan and directions.</p>
    <div id="nightlist"><p class="empty">Loading nights…</p></div>
  </section>

  <section id="spots" hidden>
    <input class="search" id="q-spots" type="search" placeholder="Search places, hikes, notes">
    <div class="filters" id="f-kind"></div>
    <div class="filters" id="f-region-spots"></div>
    <div id="spotlist"><p class="empty">Loading places…</p></div>
  </section>

  <section id="camps" hidden>
    <input class="search" id="q-camps" type="search" placeholder="Search campsites">
    <div class="filters" id="f-type"></div>
    <div class="filters" id="f-region-camps"></div>
    <div id="camplist"><p class="empty">Loading campsites…</p></div>
  </section>
</main>

<button class="fab" id="fab" type="button">+ Add stop</button>
<div class="dayview" id="dayview" role="dialog" aria-modal="true" aria-label="Day plan" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden><form class="sheet-in" id="form"></form></div>
<div class="toast" id="toast" hidden></div>

<script>
const REGIONS=["Marlborough","Nelson/Tasman","West Coast","Otago","Fiordland","Southland","Canterbury"];
const KINDS={place:"Place",hike:"Hike",bike:"Bike / disc golf"};
const CAMPTYPES={doc:"DOC pass",free:"Free (self-contained)",paid:"Paid",booked:"Booked",unknown:"Unsorted"};
const KM_COST=0.38, ROAD=1.3;
const state={tab:"route",stops:[],spots:[],camps:[],kind:"all",regS:"all",regC:"all",ctype:"all",qS:"",qC:"",readOnly:false,nights:[],showPast:false,showDone:false,day:null,ideaQ:"",ideaAll:false};
let db=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.toLocaleDateString("en-CA",{timeZone:"Pacific/Auckland"})};
const fmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-NZ",{day:"numeric",month:"short"}):"";
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const hasLL=s=>typeof s.lat==="number"&&typeof s.lng==="number"&&!isNaN(s.lat)&&!isNaN(s.lng);
const sortStops=()=>[...state.stops].sort((a,b)=>(a.start||"9").localeCompare(b.start||"9")||(a.name||"").localeCompare(b.name||""));

/* ---------- map ---------- */
const COAST=[[-40.5,172.65],[-40.68,172.7],[-40.8,173.0],[-41.05,173.05],[-41.27,173.28],[-41.0,173.6],[-40.82,173.85],[-40.99,174.31],[-41.27,174.3],[-41.73,174.28],[-42.1,173.95],[-42.42,173.7],[-42.85,173.3],[-43.15,172.8],[-43.53,172.75],[-43.6,173.0],[-43.75,173.12],[-43.88,172.85],[-43.85,172.4],[-44.1,171.8],[-44.4,171.27],[-44.75,171.15],[-45.1,170.97],[-45.5,170.75],[-45.88,170.6],[-46.2,170.15],[-46.45,169.81],[-46.6,169.4],[-46.67,169.0],[-46.6,168.33],[-46.36,168.0],[-46.25,167.4],[-46.16,166.6],[-45.7,166.65],[-45.25,166.85],[-44.95,167.3],[-44.6,167.8],[-44.25,168.2],[-43.98,168.6],[-43.88,169.0],[-43.6,169.6],[-43.4,169.82],[-43.22,170.16],[-42.95,170.65],[-42.72,170.96],[-42.45,171.2],[-42.1,171.33],[-41.75,171.6],[-41.5,171.9],[-41.25,172.1],[-41.1,172.1],[-40.78,172.22],[-40.65,172.43]];
const LAT0=-40.35,LAT1=-46.85,LNG0=166.3,LNG1=174.6,W=400,H=470;
const kx=Math.cos(43.6*Math.PI/180);
const scale=Math.min((W-20)/((LNG1-LNG0)*kx),(H-20)/(LAT0-LAT1));
const P=(lat,lng)=>[10+(lng-LNG0)*kx*scale,10+(LAT0-lat)*scale];
function drawMap(){
  const t=today(),stops=sortStops().filter(hasLL);
  let s=`<rect width="${W}" height="${H}" fill="var(--water)"/>`;
  s+=`<polygon points="${COAST.map(c=>P(...c).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="var(--land)" stroke="var(--line)" stroke-width="1.2" stroke-linejoin="round"/>`;
  if(stops.length>1){
    const past=[],fut=[];
    stops.forEach(st=>{const pt=P(st.lat,st.lng);(isPastStop(st,t)?past:fut).push(pt)});
    if(past.length&&fut.length)fut.unshift(past[past.length-1]);
    if(past.length>1)s+=`<polyline points="${past.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>`;
    if(fut.length>1)s+=`<polyline points="${fut.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--tussock)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  const cur=currentStop();
  stops.forEach(st=>{const [x,y]=P(st.lat,st.lng);const isPast=isPastStop(st,t);const isNow=cur&&cur.id===st.id;
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isNow?7:3.6}" fill="${isNow?"var(--fern)":isPast?"var(--muted)":"var(--card)"}" stroke="${isNow?"var(--card)":isPast?"var(--muted)":"var(--tussock)"}" stroke-width="2"><title>${esc(st.name)}</title></circle>`;});
  if(cur&&hasLL(cur)){const [x,y]=P(cur.lat,cur.lng);const left=x>W*0.6;

const addDays=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};

function nightInfo(d){const o=state.nights.find(n=>n.id===d),s=stopFor(d);
  return {date:d,stop:s,override:o,camp:(o&&o.camp!=null?o.camp:s?.camp)||"",type:(o?o.campType:s?.campType)||"unknown",notes:o?.notes||""}}

async function saveNight(d,v){

async function planAct(op,id){

/* ---------- route ---------- */
function renderRoute(){
  const t=today(),st=sortStops();
  $("#s-stops").textContent=st.length;
  let km=0,kmLeft=0;
  const legs=st.map((s,i)=>{if(i===0||!hasLL(s)||!hasLL(st[i-1]))return null;const d=Math.round(hav(st[i-1],s)*ROAD);km+=d;if((s.start||"")>t)kmLeft+=d;return d});
  $("#s-km").textContent=km?km.toLocaleString("en-NZ"):"–";
  $("#s-cost").textContent=kmLeft?"$"+Math.round(kmLeft*KM_COST).toLocaleString("en-NZ"):"–";
  $("#s-cost").title="Estimated diesel + RUC for the km still ahead";
  // progress
  if(st.length){const a=new Date(st[0].start),b=new Date(st[st.length-1].end||st[st.length-1].start),n=new Date(t);
    const total=Math.max(1,Math.round((b-a)/864e5)+1),done=Math.min(total,Math.max(0,Math.round((n-a)/864e5)+1));
    $("#bar").style.width=(done/total*100)+"%";$("#dayline").textContent=`Day ${done} of ${total}`;}
  if(!st.length){$("#timeline").innerHTML=`<p class="empty">No stops yet. Tap <b>+ Add stop</b> to put your first campsite or town on the route.</p>`;drawMap();return}
  const cur=currentStop();
  const stopHtml=(s,i,past,isNow,showLeg)=>{
    const nights=s.end&&s.start?Math.max(0,Math.round((new Date(s.end)-new Date(s.start))/864e5)):0;
    const days=[];if(s.start){let d=s.start,g=0;const e=s.end&&s.end>s.start?s.end:addDays(s.start,1);while(d<e&&g++<60){days.push(d);d=addDays(d,1)}}
    const chips=days.map(d=>{const c=state.spots.filter(x=>x.day===d).length;return `<button class="daychip ${d===t?"today":""}" type="button" data-day="${d}">${new Date(d+"T12:00:00").toLocaleDateString("en-NZ",{weekday:"short",day:"numeric"})}${c?`<span>${c}</span>`:""}</button>`}).join("");
    return (showLeg&&legs[i]?`<div class="leg" style="padding-left:88px">↓ ~${legs[i]} km · ~$${Math.round(legs[i]*KM_COST)}</div>`:"")+
    `<div class="stop ${past?"past":""} ${isNow?"now":""}">
      <div class="dates"><b>${fmt(s.start)}</b>${s.end&&s.end!==s.start?"→ "+fmt(s.end):""}${nights?`<br>${nights} night${nights>1?"s":""}`:""}</div>
      <div style="min-width:0"><h3>${esc(s.name)}</h3>
        <div class="chips">${s.region?`<span class="chip">${esc(s.region)}</span>`:""}${s.camp?`<span class="chip c-${esc(s.campType||"unknown")}">⛺ ${esc(s.camp)}</span>`:""}</div>
        ${s.notes?`<p>${esc(s.notes)}</p>`:""}<div class="daychips">${chips}</div>${past?"":linkRow(s)}</div>
      <button class="icon-btn" data-edit="stop:${esc(s.id)}" aria-label="Edit ${esc(s.name)}">✎</button></div>`};
  const now=[],up=[],done=[];
  st.forEach((s,i)=>{const past=isPastStop(s,t),isNow=!!(cur&&cur.id===s.id);(isNow?now:past?done:up).push([s,i,past,isNow])});
  let html="";
  if(now.length)html+=`<div class="group-h">Now</div>`+now.map(x=>stopHtml(...x,false)).join("");
  if(up.length)html+=`<div class="group-h">Coming up</div>`+up.map(x=>stopHtml(...x,true)).join("");
  if(done.length){html+=`<div class="group-h">Done</div><button class="pill" type="button" data-showdone>${state.showDone?"Hide":"Show"} ${done.length} done stop${done.length>1?"s":""}</button>`;
    if(state.showDone)html+=done.slice().reverse().map(x=>stopHtml(...x,false)).join("")}
  $("#timeline").innerHTML=html;drawMap();renderNow();
}

/* ---------- lists ---------- */
function pills(el,opts,cur,key){el.innerHTML=opts.map(([v,l,n])=>`<button class="pill" type="button" aria-pressed="${v===cur}" data-f="${key}" data-v="${esc(v)}">${esc(l)}${n!=null?` <span class="mono">${n}</span>`:""}</button>`).join("")}
function grouped(items,render){
  const by={};items.forEach(it=>{(by[it.region||"Other"]??=[]).push(it)});
  const order=[...REGIONS,...Object.keys(by).filter(r=>!REGIONS.includes(r))];
  return order.filter(r=>by[r]).map(r=>`<div class="region-h">${esc(r)}<span>${by[r].length}</span></div>`+by[r].sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||(a.name||"").localeCompare(b.name||"")).map(render).join("")).join("");
}
function renderSpots(){
  const q=state.qS.toLowerCase();
  const base=state.spots.filter(s=>state.regS==="all"||s.region===state.regS);
  pills($("#f-kind"),[["all","All",base.length],["fav","♥ Favourites",base.filter(s=>s.fav).length],["todo","To do",base.filter(s=>!s.done).length],...Object.entries(KINDS).map(([k,l])=>[k,l,base.filter(s=>s.kind===k).length])],state.kind,"kind");
  pills($("#f-region-spots"),[["all","All regions"],...REGIONS.map(r=>[r,r])],state.regS,"regS");
  const items=base.filter(s=>(state.kind==="all"||(state.kind==="fav"?s.fav:state.kind==="todo"?!s.done:s.kind===state.kind))&&(!q||(s.name+" "+(s.notes||"")).toLowerCase().includes(q)));
  $("#spotlist").innerHTML=items.length?grouped(items,s=>`<div class="row ${s.done?"done":""}">
     <div class="toggles"><button class="tg fav ${s.fav?"on":""}" data-tog="fav:${esc(s.id)}" aria-pressed="${!!s.fav}" aria-label="Favourite">♥</button><button class="tg chk ${s.done?"on":""}" data-tog="done:${esc(s.id)}" aria-pressed="${!!s.done}" aria-label="Done">✓</button></div>
     <div style="min-width:0"><div class="kind">${esc(KINDS[s.kind]||s.kind||"")}</div><div class="name">${esc(s.name)}</div>${s.notes?`<div class="note">${esc(s.notes)}</div>`:""}${s.day?`<div class="daychips"><button class="daychip" type="button" data-day="${s.day}">Planned ${fmt(s.day)}</button></div>`:""}${navLinks(s,s.kind,true)}</div>
     <button class="icon-btn" data-edit="spot:${esc(s.id)}" aria-label="Edit ${esc(s.name)}">✎</button></div>`):`<p class="empty">Nothing here yet. Tap <b>+ Add place</b> to save a spot, hike or bike trail.</p>`;
}
function renderCamps(){
  const q=state.qC.toLowerCase();
  const base=state.camps.filter(c=>state.regC==="all"||c.region===state.regC);
  pills($("#f-type"),[["all","All",base.length],...Object.entries(CAMPTYPES).map(([k,l])=>[k,l,base.filter(c=>(c.type||"unknown")===k).length]).filter(x=>x[2]||x[0]===state.ctype)],state.ctype,"ctype");
  pills($("#f-region-camps"),[["all","All regions"],...REGIONS.map(r=>[r,r])],state.regC,"regC");
  const items=base.filter(c=>(state.ctype==="all"||(c.type||"unknown")===state.ctype)&&(!q||(c.name+" "+(c.notes||"")).toLowerCase().includes(q)));
  $("#camplist").innerHTML=items.length?grouped(items,c=>`<div class="row">
     <div class="toggles"><button class="tg fav ${c.fav?"on":""}" data-ctog="fav:${esc(c.id)}" aria-pressed="${!!c.fav}" aria-label="Favourite">♥</button></div>
     <div style="min-width:0"><div class="name">${esc(c.name)}</div><div class="chips"><span class="chip c-${esc(c.type||"unknown")}">${esc(CAMPTYPES[c.type]||"Unsorted")}</span></div>${c.notes?`<div class="note">${esc(c.notes)}</div>`:""}${navLinks(c,"camp",true)}</div>
     <button class="icon-btn" data-edit="camp:${esc(c.id)}" aria-label="Edit ${esc(c.name)}">✎</button></div>`):`<p class="empty">No campsites match. Tap <b>+ Add campsite</b> to save one.</p>`;
}
function render(){renderRoute();renderNights();renderSpots();renderCamps();renderDay()}

/* ---------- sheet / forms ---------- */
const COLL={stop:"stops",spot:"spots",camp:"camps"};
function regionSelect(v){return `<select id="f-region" name="region"><option value="">—</option>${REGIONS.map(r=>`<option ${r===v?"selected":""}>${esc(r)}</option>`).join("")}</select>`}
function openSheet(type,item){
  const it=item||{},isNew=!item,f=$("#form");let body="";
  if(type==="stop"){
    const last=sortStops().slice(-1)[0];
    body=`<label>Name<input id="f-name" name="name" required value="${esc(it.name)}" placeholder="e.g. Lake Mapourika"></label>
    <div class="two"><label>Arrive<input id="f-start" name="start" type="date" required value="${esc(it.start||(last?.end||today()))}"></label>
    <label>Leave<input id="f-end" name="end" type="date" value="${esc(it.end)}"></label></div>
    <label>Region${regionSelect(it.region)}</label>
    <div class="two"><label>Campsite (every night)<input id="f-camp" name="camp" list="camp-names" value="${esc(it.camp)}" placeholder="Campsite"></label>
    <label>Camp type<select id="f-ctype" name="campType">${Object.entries(CAMPTYPES).map(([k,l])=>`<option value="${k}" ${k===(it.campType||"unknown")?"selected":""}>${l}</option>`).join("")}</select></label></div>
    <datalist id="camp-names">${state.camps.map(c=>`<option value="${esc(c.name)}">`).join("")}</datalist>
    <div class="two"><label>Latitude<input id="f-lat" name="lat" inputmode="decimal" value="${it.lat??""}" placeholder="-43.31"></label>
    <label>Longitude<input id="f-lng" name="lng" inputmode="decimal" value="${it.lng??""}" placeholder="170.20"></label></div>
    <span class="hint">Coordinates put the stop on the map and count its km. In Google Maps, long-press a spot and copy the two numbers.</span>
    <label>MetService forecast link<input id="f-weather" name="weather" type="url" value="${esc(it.weather)}" placeholder="https://www.metservice.com/towns-cities/…"><span class="hint">Open the nearest town on metservice.com and paste its address here.</span></label>
    <label>Notes<textarea id="f-notes" name="notes">${esc(it.notes)}</textarea></label>`;
  } else if(type==="spot"){
    body=`<label>Name<input id="f-name" name="name" required value="${esc(it.name)}"></label>
    <div class="two"><label>Type<select id="f-kind" name="kind">${Object.entries(KINDS).map(([k,l])=>`<option value="${k}" ${k===(it.kind||"place")?"selected":""}>${l}</option>`).join("")}</select></label>
    <label>Region${regionSelect(it.region||(state.regS!=="all"?state.regS:""))}</label></div>
    <label>Notes<textarea id="f-notes" name="notes" placeholder="Distance, time, tides, closures…">${esc(it.notes)}</textarea></label>
    <label>Plan for day<input id="f-day" name="day" type="date" value="${esc(it.day)}"><span class="hint">Leave empty to keep it as an idea.</span></label>
    <label>Map location<input id="f-loc" name="loc" value="${esc(it.loc)}" placeholder="Car park name or coordinates, e.g. -43.43, 169.97"><span class="hint">Used for Google Maps and Waze. Empty = search by name.</span></label>
    <label>Info link<input id="f-url" name="url" type="url" value="${esc(it.url)}" placeholder="https://www.doc.govt.nz/…"></label>`;
  } else {
    body=`<label>Name<input id="f-name" name="name" required value="${esc(it.name)}"></label>
    <div class="two"><label>Type<select id="f-type" name="type">${Object.entries(CAMPTYPES).map(([k,l])=>`<option value="${k}" ${k===(it.type||"unknown")?"selected":""}>${l}</option>`).join("")}</select></label>
    <label>Region${regionSelect(it.region||(state.regC!=="all"?state.regC:""))}</label></div>
    <label>Notes<textarea id="f-notes" name="notes" placeholder="Price, facilities, booking, max nights…">${esc(it.notes)}</textarea></label>
    <label>Map location<input id="f-loc" name="loc" value="${esc(it.loc)}" placeholder="Coordinates, e.g. -44.441, 169.262"><span class="hint">Used for Google Maps and Waze. Empty = search by name.</span></label>
    <label>Info link<input id="f-url" name="url" type="url" value="${esc(it.url)}" placeholder="https://www.doc.govt.nz/…"></label>`;
  }
  const label={stop:"stop",spot:"place",camp:"campsite"}[type];
  f.innerHTML=`<h2 id="sheet-title">${isNew?"Add "+label:"Edit "+label}</h2>${body}
   <div class="actions"><div>${isNew?"":`<button type="button" class="btn danger" id="del">Delete</button>`}</div>
   <div style="display:flex;gap:8px"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary" type="submit">${isNew?"Add":"Save"}</button></div></div>`;
  f.dataset.type=type;f.dataset.id=it.id||"";
  $("#scrim").hidden=false;$("#sheet").hidden=false;setTimeout(()=>$("#f-name")?.focus(),50);
  $("#cancel").onclick=closeSheet;
  const del=$("#del");if(del)del.onclick=()=>{if(del.dataset.armed){remove(type,it.id);closeSheet()}else{del.dataset.armed=1;del.textContent="Tap again to delete"}};
}
function closeSheet(){$("#scrim").hidden=true;$("#sheet").hidden=true}
$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#sheet").hidden)closeSheet();else if(state.day)closeDay()});
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,type=f.dataset.type,id=f.dataset.id;if(type==="settings")return;
  const d=Object.fromEntries(new FormData(f).entries());
  for(const k in d)d[k]=d[k].trim();
  if(type==="night"){closeSheet();await saveNight(id,d);return}
  if(type==="spot"&&!d.day)d.day=null;
  if(type==="stop"){d.lat=d.lat===""?null:parseFloat(d.lat.replace(",","."));d.lng=d.lng===""?null:parseFloat(d.lng.replace(",","."));if(d.end&&d.end<d.start)d.end=d.start}
  const prev=id?state[COLL[type]].find(x=>x.id===id):null;
  const doc={...(prev||{}),...d};delete doc.id;
  closeSheet();await save(type,id||null,doc);
});

/* ---------- data ---------- */
async function save(type,id,doc){
  if(!db){toast("Can't save here — open the page signed in to claude.ai");return}
  if(state.readOnly){toast("You can view this plan but not change it");return}
  try{const coll=db.collection(COLL[type]);doc.updatedAt=new Date().toISOString();
    if(id)await coll.doc(id).set(doc);else await coll.add(doc);
    toast(id?"Saved":"Added")}
  catch(e){handleErr(e)}
}
async function remove(type,id){if(!db||state.readOnly)return;try{await db.collection(COLL[type]).doc(id).delete();toast("Deleted")}catch(e){handleErr(e)}}
async function toggle(coll,id,field){
  const arr=coll==="spots"?state.spots:state.camps,it=arr.find(x=>x.id===id);if(!it)return;
  if(!db||state.readOnly){toast(db?"You can view this plan but not change it":"Open signed in to change things");return}
  it[field]=!it[field];render();
  try{await db.collection(coll).doc(id).update({[field]:it[field]})}catch(e){it[field]=!it[field];render();handleErr(e)}
}
function handleErr(e){const c=e&&e.code;
  if(c==="invalid_argument"){state.readOnly=true;$("#fab").hidden=true;toast("You can view this plan but not change it")}
  else if(c==="quota_exceeded")toast("The plan is full — delete a few old items to add new ones");
  else toast("Couldn't save on this phone — storage may be full")}
function listen(name){
  db.collection(name).onSnapshot(snap=>{state[name]=snap.docs.map(d=>({id:d.id,...d.data()}));render()},
    e=>{if(e.code!=="revoked")toast("Lost connection to the plan — reload the page")});
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){state.tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t===b));
    ["route","nights","spots","camps"].forEach(s=>$("#"+s).hidden=s!==state.tab);
    $("#fab").textContent={route:"+ Add stop",nights:"+ Add stop",spots:"+ Add place",camps:"+ Add campsite"}[state.tab];
    try{localStorage.setItem("tab",state.tab)}catch{} window.scrollTo(0,0);}
  else if(b.hasAttribute("data-closeday")){closeDay()}
  else if(b.dataset.day){openDay(b.dataset.day)}
  else if(b.dataset.plan){const [op,id]=b.dataset.plan.split(":");planAct(op,id)}
  else if(b.hasAttribute("data-showdone")){state.showDone=!state.showDone;renderRoute()}
  else if(b.hasAttribute("data-ideaall")){state.ideaAll=true;renderIdeas()}
  else if(b.dataset.night){openNight(b.dataset.night)}
  else if(b.hasAttribute("data-showpast")){state.showPast=!state.showPast;renderNights()}
  else if(b.dataset.f){state[b.dataset.f]=b.dataset.v;render()}
  else if(b.dataset.edit){const [t,id]=b.dataset.edit.split(":");openSheet(t,state[COLL[t]].find(x=>x.id===id))}
  else if(b.dataset.tog){const [f,id]=b.dataset.tog.split(":");toggle("spots",id,f)}
  else if(b.dataset.ctog){const [f,id]=b.dataset.ctog.split(":");toggle("camps",id,f)}
});
$("#fab").onclick=()=>openSheet({route:"stop",nights:"stop",spots:"spot",camps:"camp"}[state.tab]);
$("#q-spots").oninput=e=>{state.qS=e.target.value;renderSpots()};
$("#q-camps").oninput=e=>{state.qC=e.target.value;renderCamps()};
try{const t=localStorage.getItem("tab");if(t&&t!=="route")document.querySelector(`[data-tab="${t}"]`)?.click()}catch{}

render();

/* ---------- local storage (this phone only) ---------- */
const KEY="sil-plan-v1",PREV="sil-plan-prev";
function localDB(){
  let data=null;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}
  const subs={};
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast("Couldn't save on this phone — storage may be full")}};
  const snap=c=>({docs:Object.entries(data?.[c]||{}).map(([id,v])=>({id,data:()=>v}))});
  const emit=c=>(subs[c]||[]).forEach(f=>f(snap(c)));
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const clone=v=>JSON.parse(JSON.stringify(v));
  const ensure=c=>{data??={};data[c]??={};return data[c]};
  return {
    hasData:()=>!!data&&Object.keys(data.stops||{}).length>0,
    dump:()=>({stops:{},spots:{},camps:{},nights:{},...clone(data||{})}),
    replace(d){try{if(data)localStorage.setItem(PREV,JSON.stringify(data))}catch{}data={stops:d.stops||{},spots:d.spots||{},camps:d.camps||{},nights:d.nights||{}};persist();["stops","spots","camps","nights"].forEach(emit)},
    collection(c){return{
      onSnapshot(f){(subs[c]??=[]).push(f);setTimeout(()=>f(snap(c)),0);return()=>{}},
      doc(id){id=id||newId();return{
        set:async v=>{ensure(c)[id]=clone(v);persist();emit(c)},
        update:async v=>{const o=ensure(c)[id];if(!o)throw{code:"invalid_argument"};Object.assign(o,clone(v));persist();emit(c)},
        delete:async()=>{delete ensure(c)[id];persist();emit(c)}}},
      add:async v=>{const id=newId();ensure(c)[id]=clone(v);persist();emit(c);return{id}}
    }}
  };
}
async function fetchPlan(){const r=await fetch("plan.json",{cache:"no-store"});if(!r.ok)throw new Error("not found");return r.json()}
const validPlan=d=>d&&typeof d==="object"&&d.stops&&typeof d.stops==="object";
(async()=>{
  db=localDB();
  try{navigator.storage?.persist?.()}catch{}
  if(!db.hasData()){try{db.replace(await fetchPlan())}catch{toast("Couldn't load the starting plan — connect once and reopen")}}
  ["stops","spots","camps","nights"].forEach(listen);
})();

/* ---------- backup & settings ---------- */
function backupBlob(){return new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),...db.dump()})],{type:"application/json"})}
function downloadBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(backupBlob());a.download=`south-island-loop-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Backup saved to Downloads")}
async function shareBackup(){const f=new File([backupBlob()],`south-island-loop-${today()}.json`,{type:"application/json"});
  try{await navigator.share({files:[f],title:"South Island Loop backup"})}catch(e){if(e&&e.name!=="AbortError")downloadBackup()}}
function armed(btn,label,fn){btn.onclick=()=>{if(btn.dataset.armed){fn()}else{btn.dataset.armed=1;btn.textContent=label}}}
function openSettings(){
  const f=$("#form"),canShare=!!(navigator.canShare&&navigator.canShare({files:[new File(["{}"],"x.json",{type:"application/json"})]}));
  let prev=false;try{prev=!!localStorage.getItem(PREV)}catch{}
  const counts=["stops","spots","camps"].map(c=>Object.keys(db?.dump()[c]||{}).length);
  f.dataset.type="settings";f.dataset.id="";
  f.innerHTML=`<h2 id="sheet-title">Backup &amp; settings</h2>
   <span class="hint">Your plan is saved on this phone only and works without signal: ${counts[0]} stops, ${counts[1]} places, ${counts[2]} campsites.</span>
   <div class="actions" style="justify-content:flex-start">
     ${canShare?`<button type="button" class="btn primary" id="s-share">Share backup file</button>`:""}
     <button type="button" class="btn ${canShare?"":"primary"}" id="s-dl">Save backup to phone</button></div>
   <span class="hint">Make a backup now and then, and send it to Claude when you want the plan changed for you.</span>
   <label>Restore from a backup or plan file<input type="file" id="s-file" accept=".json,application/json"></label>
   <button type="button" class="btn" id="s-latest">Load the latest plan from Claude</button>
   <span class="hint">Replaces everything on this phone with the version Claude last published. Your current plan is kept so you can undo once.</span>
   ${prev?`<button type="button" class="btn" id="s-undo">Undo last restore</button>`:""}
   <a class="lk" href="../" style="justify-self:start">Open Kea budget →</a>
   <div class="actions"><span></span><button type="button" class="btn" id="cancel">Close</button></div>`;
  $("#scrim").hidden=false;$("#sheet").hidden=false;
  $("#cancel").onclick=closeSheet;
  $("#s-dl").onclick=downloadBackup;
  if($("#s-share"))$("#s-share").onclick=shareBackup;
  $("#s-file").onchange=async e=>{const file=e.target.files[0];if(!file)return;
    try{const d=JSON.parse(await file.text());if(!validPlan(d))throw 0;db.replace(d);closeSheet();toast("Plan restored")}catch{toast("That file isn't a South Island Loop plan")}};
  armed($("#s-latest"),"Tap again to replace this phone's plan",async()=>{try{db.replace(await fetchPlan());closeSheet();toast("Latest plan loaded")}catch{toast("Couldn't reach GitHub — try again with signal")}});
  if($("#s-undo"))armed($("#s-undo"),"Tap again to undo",()=>{try{const p=JSON.parse(localStorage.getItem(PREV));db.replace(p);localStorage.removeItem(PREV);closeSheet();toast("Restored previous plan")}catch{toast("Nothing to undo")}});
}
$("#menu").onclick=openSettings;
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
